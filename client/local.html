<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gals Panic — Local Co-op</title>
<style>
  :root { --bg:#0b0d16; --panel:#161a2b; --ink:#e8ebf7; --muted:#8b93b5; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #1a1f38, var(--bg));
    color: var(--ink); font-family: system-ui, "Segoe UI", sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:10px; padding:14px;
    user-select:none; -webkit-user-select:none;
  }
  h1 { margin:2px 0 0; font-size:20px; letter-spacing:.5px; }
  h1 span { color:#ff5db1; }
  #hud { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:stretch; }
  .chip { background:var(--panel); border:1px solid #232a44; border-radius:12px; padding:7px 12px;
          display:flex; flex-direction:column; gap:2px; min-width:120px; }
  .chip .top { display:flex; align-items:center; gap:7px; font-weight:600; font-size:13px; }
  .chip .dot { width:12px; height:12px; border-radius:4px; box-shadow:0 0 8px currentColor; }
  .chip .bar { height:6px; border-radius:4px; background:#0c0f1c; overflow:hidden; margin-top:3px; }
  .chip .bar > i { display:block; height:100%; width:0; border-radius:4px; }
  .chip .meta { font-size:11px; color:var(--muted); display:flex; justify-content:space-between; }
  .chip.dead { opacity:.4; filter:grayscale(1); }
  #stage { position:relative; }
  canvas { display:block; background:#05060c; border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  #help { color:var(--muted); font-size:12px; text-align:center; max-width:820px; line-height:1.5; }
  kbd { background:#232a44; border-radius:5px; padding:1px 6px; font-size:11px; color:#cfd6f5; }
</style>
</head>
<body>
  <h1>GALS <span>PANIC</span> — Local Co-op</h1>
  <div id="hud"></div>
  <div id="stage">
    <canvas id="c" width="800" height="600"></canvas>
  </div>
  <div id="help">
    안전지대(칠해진 곳) 위를 걷다 빈 공간으로 들어가면 <b>선</b>이 그려집니다. 선이 다시 안전지대에 닿으면 안쪽이 <b>점유</b>되어 그림이 드러납니다.
    <br>빨간 적이 당신의 <b>선</b>에 닿으면 목숨을 잃어요. 화면의 <b>80%</b>를 열면 클리어! ·
    <kbd>P</kbd> 일시정지 · <kbd>R</kbd> 재시작
  </div>

<script>
"use strict";
/* =========================================================================
   Gals Panic — faithful Qix engine (grid-based), local multiplayer.
   The simulation (GalGame) is intentionally DOM-free so it can be ported
   to a server-authoritative online version later.
   ========================================================================= */

// ---- constants ----
const CELL = 5;
const COLS = 160, ROWS = 120;            // 800 x 600 play field
const N = COLS * ROWS;
const B = 3;                              // border thickness (claimed ring)
const EMPTY = 0, CLAIMED = 1;
const TARGET = 0.80;                      // clear ratio
const MOVE_MS = 26;                       // player step interval
const PLAYER_DEFS = [
  { name:"P1", color:"#22d3ee", keys:{ ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0] } },
  { name:"P2", color:"#f472b6", keys:{ KeyW:[0,-1], KeyS:[0,1], KeyA:[-1,0], KeyD:[1,0] } },
  { name:"P3", color:"#a3e635", keys:{ KeyI:[0,-1], KeyK:[0,1], KeyJ:[-1,0], KeyL:[1,0] } },
  { name:"P4", color:"#fb923c", keys:{ Numpad8:[0,-1], Numpad5:[0,1], Numpad4:[-1,0], Numpad6:[1,0] } },
];

const idx = (x,y) => y*COLS + x;
const inBounds = (x,y) => x>=0 && y>=0 && x<COLS && y<ROWS;

// ------------------------------------------------------------------ engine
class GalGame {
  constructor(numPlayers, level=1) {
    this.numPlayers = numPlayers;
    this.level = level;
    this.grid = new Uint8Array(N);
    this.trail = new Uint8Array(N);       // 0 = none, else owner id (1-based)
    this.totalInterior = (COLS-2*B) * (ROWS-2*B);
    this.claimedInterior = 0;
    this.dirty = true;                    // reveal mask needs rebuild
    this.over = null;                     // null | 'won' | 'lost'

    // claimed border ring
    for (let y=0; y<ROWS; y++)
      for (let x=0; x<COLS; x++)
        if (x<B || y<B || x>=COLS-B || y>=ROWS-B) this.grid[idx(x,y)] = CLAIMED;

    // players spawn ON the claimed ring (adjacent to the interior), near corners
    const spawns = [
      [B, B-1], [COLS-1-B, B-1], [B, ROWS-B], [COLS-1-B, ROWS-B],
    ];
    this.players = [];
    for (let i=0; i<numPlayers; i++) {
      const def = PLAYER_DEFS[i];
      const [sx, sy] = spawns[i];
      this.players.push({
        id: i+1, name: def.name, color: def.color, keymap: def.keys,
        x: sx, y: sy, spawnX: sx, spawnY: sy,
        drawing: false, lives: 3, out: false, claimed: 0,
        acc: 0, trailCells: [],
      });
    }

    // enemies bounce inside the empty field
    this.enemies = [];
    const enemyCount = 1 + numPlayers + (level-1);   // scales with players & level
    const speed = 20 + (level-1)*4;
    for (let i=0; i<enemyCount; i++) {
      const ang = Math.random()*Math.PI*2;
      this.enemies.push({
        x: COLS/2 + (Math.random()-.5)*40,
        y: ROWS/2 + (Math.random()-.5)*30,
        vx: Math.cos(ang)*speed || speed,
        vy: Math.sin(ang)*speed || speed,
        r: 2.2, spin: Math.random()*6,
      });
    }
  }

  get ratio() { return this.claimedInterior / this.totalInterior; }

  isWall(x,y) { return !inBounds(x,y) || this.grid[idx(x,y)] === CLAIMED; }

  // attempt one grid step for a player in direction (dx,dy)
  step(p, dx, dy) {
    if (this.over || p.out) return;
    if (dx===0 && dy===0) return;
    const nx = p.x+dx, ny = p.y+dy;
    if (!inBounds(nx,ny)) return;
    const ni = idx(nx,ny);
    if (this.trail[ni] !== 0) return;                 // blocked by any trail
    if (this.grid[ni] === CLAIMED) {                  // stepping onto safe zone
      p.x = nx; p.y = ny;
      if (p.drawing) { this.closeArea(p); p.drawing = false; }
    } else {                                          // drawing into empty space
      p.drawing = true;
      p.x = nx; p.y = ny;
      this.trail[ni] = p.id;
      p.trailCells.push(ni);
    }
  }

  // player's trail reconnected to safe zone -> claim enclosed empty regions
  closeArea(p) {
    let gained = 0;
    // 1) trail becomes solid wall
    for (const i of p.trailCells) {
      if (this.grid[i] === EMPTY) { this.grid[i] = CLAIMED; gained++; }
      this.trail[i] = 0;
    }
    p.trailCells.length = 0;

    // 2) flood from every enemy across EMPTY cells -> "reachable" stays empty
    const reach = new Uint8Array(N);
    const stack = [];
    for (const e of this.enemies) {
      const ex = Math.floor(e.x), ey = Math.floor(e.y);
      if (inBounds(ex,ey) && this.grid[idx(ex,ey)] === EMPTY && !reach[idx(ex,ey)]) {
        reach[idx(ex,ey)] = 1; stack.push(ex,ey);
      }
    }
    while (stack.length) {
      const y = stack.pop(), x = stack.pop();
      const nb = [[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
      for (const [ax,ay] of nb) {
        if (!inBounds(ax,ay)) continue;
        const ai = idx(ax,ay);
        if (this.grid[ai] === EMPTY && !reach[ai]) { reach[ai] = 1; stack.push(ax,ay); }
      }
    }

    // 3) any empty cell the enemies can't reach gets claimed
    for (let i=0; i<N; i++) {
      if (this.grid[i] === EMPTY && !reach[i]) { this.grid[i] = CLAIMED; gained++; }
    }

    p.claimed += gained;
    this.claimedInterior += gained;
    this.dirty = true;
    this.onClaim && this.onClaim(gained);
    if (this.ratio >= TARGET) { this.over = 'won'; this.onEnd && this.onEnd('won'); }
  }

  killPlayer(p) {
    for (const i of p.trailCells) this.trail[i] = 0;
    p.trailCells.length = 0;
    p.drawing = false;
    p.x = p.spawnX; p.y = p.spawnY; p.acc = 0;
    p.lives--;
    this.onDeath && this.onDeath(p);
    if (p.lives <= 0) {
      p.out = true;
      if (this.players.every(q => q.out)) { this.over = 'lost'; this.onEnd && this.onEnd('lost'); }
    }
  }

  // advance enemies by dt seconds
  updateEnemies(dt) {
    if (this.over) return;
    for (const e of this.enemies) {
      e.spin += dt*8;
      let nx = e.x + e.vx*dt;
      if (this.isWall(Math.floor(nx), Math.floor(e.y))) e.vx = -e.vx;
      else e.x = nx;
      let ny = e.y + e.vy*dt;
      if (this.isWall(Math.floor(e.x), Math.floor(ny))) e.vy = -e.vy;
      else e.y = ny;

      // touching a trail cell kills its owner
      const ci = idx(Math.floor(e.x), Math.floor(e.y));
      const owner = this.trail[ci];
      if (owner) {
        const p = this.players.find(q => q.id === owner);
        if (p) this.killPlayer(p);
      }
    }
  }
}

// ---------------------------------------------------------------- rendering
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const hudEl = document.getElementById("hud");

// offscreen: the artwork (revealed) + the dark reveal mask
const artCanvas = document.createElement("canvas");
artCanvas.width = COLS*CELL; artCanvas.height = ROWS*CELL;
const actx = artCanvas.getContext("2d");
const maskCanvas = document.createElement("canvas");
maskCanvas.width = COLS*CELL; maskCanvas.height = ROWS*CELL;
const mctx = maskCanvas.getContext("2d");

// ---- procedural, family-friendly artwork so no external assets are needed
function generateArt(seed) {
  const W = artCanvas.width, H = artCanvas.height;
  let s = seed*9301 + 49297;
  const rnd = () => { s = (s*9301 + 49297) % 233280; return s/233280; };
  const palettes = [
    ["#ff9a9e","#fecfef","#fbc2eb","#a18cd1"],
    ["#f6d365","#fda085","#f093fb","#f5576c"],
    ["#84fab0","#8fd3f4","#a6c1ee","#c2e9fb"],
    ["#fddb92","#d1fdff","#9890e3","#b1f4cf"],
    ["#ff6a88","#ff99ac","#fcb69f","#ffdde1"],
  ];
  const pal = palettes[Math.floor(rnd()*palettes.length)];
  const g = actx.createLinearGradient(0,0,W,H);
  g.addColorStop(0, pal[0]); g.addColorStop(.5, pal[1]); g.addColorStop(1, pal[3]);
  actx.fillStyle = g; actx.fillRect(0,0,W,H);
  // soft bokeh
  for (let i=0;i<70;i++){
    const r = 20+rnd()*120;
    const grd = actx.createRadialGradient(rnd()*W, rnd()*H, 0, rnd()*W, rnd()*H, r);
    actx.globalAlpha = .10+rnd()*.18;
    grd.addColorStop(0, pal[Math.floor(rnd()*pal.length)]);
    grd.addColorStop(1, "rgba(255,255,255,0)");
    actx.fillStyle = grd;
    actx.beginPath(); actx.arc(rnd()*W, rnd()*H, r, 0, Math.PI*2); actx.fill();
  }
  actx.globalAlpha = 1;
  // big centered motif (heart)
  const cx=W/2, cy=H*0.46, sc=Math.min(W,H)*0.34;
  const hg = actx.createLinearGradient(cx-sc, cy-sc, cx+sc, cy+sc);
  hg.addColorStop(0,"#ff5db1"); hg.addColorStop(1,"#ff2d78");
  actx.fillStyle = hg;
  actx.beginPath();
  for (let t=0;t<=Math.PI*2;t+=0.02){
    const hx = 16*Math.pow(Math.sin(t),3);
    const hy = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    const px = cx + hx*(sc/16), py = cy - hy*(sc/16);
    t===0 ? actx.moveTo(px,py) : actx.lineTo(px,py);
  }
  actx.closePath();
  actx.shadowColor="rgba(255,45,120,.6)"; actx.shadowBlur=40; actx.fill(); actx.shadowBlur=0;
  // sparkles
  actx.fillStyle="rgba(255,255,255,.9)";
  for (let i=0;i<40;i++){
    const x=rnd()*W, y=rnd()*H, r=1+rnd()*2.5;
    actx.beginPath(); actx.arc(x,y,r,0,Math.PI*2); actx.fill();
  }
  // caption
  actx.fillStyle="rgba(255,255,255,.85)";
  actx.font="bold 34px system-ui, sans-serif"; actx.textAlign="center";
  actx.fillText("LEVEL "+seed, W/2, H-40);
}

// rebuild the dark overlay so only claimed cells reveal the art
function rebuildMask(game) {
  mctx.clearRect(0,0,maskCanvas.width,maskCanvas.height);
  mctx.fillStyle = "#080a14";
  mctx.beginPath();
  for (let y=0;y<ROWS;y++)
    for (let x=0;x<COLS;x++)
      if (game.grid[idx(x,y)] === EMPTY) mctx.rect(x*CELL, y*CELL, CELL, CELL);
  mctx.fill();
  // subtle glow ring on the claimed frontier is skipped for perf
}

// ------------------------------------------------------------------ driver
let game = null;
let state = "menu";          // menu | playing | paused | over
let menuSel = 2;             // chosen player count on the menu

const pressOrder = [];       // codes currently held, in press order
const audio = makeAudio();

function newGame(numPlayers, level=1) {
  game = new GalGame(numPlayers, level);
  generateArt(level);
  rebuildMask(game);
  game.dirty = false;
  game.onClaim = () => audio.blip(520, .05);
  game.onDeath = () => audio.blip(120, .18, "square");
  game.onEnd   = (r) => { state = "over"; audio.blip(r==='won'?740:90, .4, r==='won'?"triangle":"sawtooth"); };
  state = "playing";
}

// ---- input ----
window.addEventListener("keydown", (e) => {
  const handled = ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)
    || /^(Key|Numpad|Digit)/.test(e.code);
  if (handled) e.preventDefault();
  if (e.repeat) return;                 // ignore OS key auto-repeat

  if (state === "menu") {
    if (e.code === "Digit1"||e.code==="Numpad1") { menuSel=1; newGame(1); }
    else if (e.code === "Digit2"||e.code==="Numpad2") { menuSel=2; newGame(2); }
    else if (e.code === "Digit3"||e.code==="Numpad3") { menuSel=3; newGame(3); }
    else if (e.code === "Digit4"||e.code==="Numpad4") { menuSel=4; newGame(4); }
    else if (e.code === "Enter"||e.code==="Space") newGame(menuSel);
    return;
  }
  if (e.code === "KeyP" && state === "playing") { state = "paused"; return; }
  else if (e.code === "KeyP" && state === "paused") { state = "playing"; last = performance.now(); return; }
  if (e.code === "KeyR") { state = "menu"; game = null; return; }
  if (state === "over" && (e.code === "Enter" || e.code === "Space")) {
    // won -> next level (keep player count); lost -> menu
    if (game && game.over === "won") newGame(game.numPlayers, game.level+1);
    else state = "menu";
    return;
  }
  if (!pressOrder.includes(e.code)) pressOrder.push(e.code);
});
window.addEventListener("keyup", (e) => {
  const i = pressOrder.indexOf(e.code);
  if (i >= 0) pressOrder.splice(i,1);
});
// losing focus (alt-tab / click away) drops all held keys, so a marker never
// gets "stuck" moving in the last direction after a missed keyup.
function releaseAllKeys(){ pressOrder.length = 0; }
window.addEventListener("blur", releaseAllKeys);
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAllKeys(); });
// resume audio on first interaction (autoplay policy)
window.addEventListener("pointerdown", () => audio.resume(), { once:false });
canvas.addEventListener("pointerdown", () => { if (state==="menu") newGame(menuSel); });

function dirFor(p) {
  let dir = null;                        // most recently pressed key wins
  for (const code of pressOrder) if (p.keymap[code]) dir = p.keymap[code];
  return dir;
}

// ---- main loop ----
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;

  if (state === "playing" && game) {
    // players move on a fixed step timer
    for (const p of game.players) {
      if (p.out) continue;
      p.acc += dt*1000;
      let guard = 0;
      while (p.acc >= MOVE_MS && guard++ < 4) {
        p.acc -= MOVE_MS;
        const d = dirFor(p);
        if (d) game.step(p, d[0], d[1]);
      }
    }
    game.updateEnemies(dt);
    if (game.dirty) { rebuildMask(game); game.dirty = false; }
  }

  render(now);
  requestAnimationFrame(frame);
}

function render(now) {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if (!game) { drawMenu(); requestHud(); return; }

  ctx.drawImage(artCanvas, 0, 0);
  ctx.drawImage(maskCanvas, 0, 0);

  // trails (glowing lines)
  for (const p of game.players) {
    if (!p.trailCells.length) continue;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 6;
    for (const i of p.trailCells) {
      const x = (i % COLS)*CELL, y = Math.floor(i/COLS)*CELL;
      ctx.fillRect(x, y, CELL, CELL);
    }
    ctx.shadowBlur = 0;
  }

  // enemies
  for (const e of game.enemies) drawEnemy(e);

  // players
  for (const p of game.players) {
    if (p.out) continue;
    const x = p.x*CELL, y = p.y*CELL;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x-1, y-1, CELL+2, CELL+2);
    ctx.fillStyle = p.color;
    ctx.fillRect(x, y, CELL, CELL);
  }

  if (state === "paused") drawCenter("일시정지", "P 를 눌러 계속");
  if (state === "over") drawOver();

  requestHud();
}

function drawEnemy(e) {
  const cx = e.x*CELL, cy = e.y*CELL, R = e.r*CELL;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(e.spin);
  ctx.fillStyle = "#ff3b5c";
  ctx.shadowColor = "#ff3b5c"; ctx.shadowBlur = 14;
  ctx.beginPath();
  for (let k=0;k<8;k++){
    const a = k*Math.PI/4;
    const r = k%2 ? R : R*0.55;
    const px = Math.cos(a)*r, py = Math.sin(a)*r;
    k===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(-R*0.2,-R*0.15,R*0.18,0,7); ctx.arc(R*0.25,-R*0.15,R*0.18,0,7); ctx.fill();
  ctx.fillStyle = "#111";
  ctx.beginPath(); ctx.arc(-R*0.2,-R*0.15,R*0.09,0,7); ctx.arc(R*0.25,-R*0.15,R*0.09,0,7); ctx.fill();
  ctx.restore();
}

function drawMenu() {
  // animated backdrop
  const t = performance.now()/1000;
  const g = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  g.addColorStop(0,"#1a1030"); g.addColorStop(1,"#0a1030");
  ctx.fillStyle = g; ctx.fillRect(0,0,canvas.width,canvas.height);
  for (let i=0;i<30;i++){
    const x = (i*97 + t*40)% canvas.width;
    const y = (i*61 + Math.sin(t+i)*20) % canvas.height;
    ctx.fillStyle = `hsla(${(i*30+t*60)%360},80%,70%,.5)`;
    ctx.beginPath(); ctx.arc(x,y,3+ (i%3),0,7); ctx.fill();
  }
  panel(canvas.width/2, canvas.height/2, 520, 300);
  ctx.textAlign = "center"; ctx.fillStyle = "#fff";
  ctx.font = "bold 44px system-ui, sans-serif";
  ctx.fillText("GALS PANIC", canvas.width/2, canvas.height/2 - 78);
  ctx.font = "16px system-ui, sans-serif"; ctx.fillStyle = "#c9d0f0";
  ctx.fillText("함께 화면을 열어 그림을 공개하세요 — 적의 선을 피해!", canvas.width/2, canvas.height/2 - 44);

  ctx.font = "bold 20px system-ui, sans-serif";
  const opts = [[1,"1인"],[2,"2인"],[3,"3인"],[4,"4인"]];
  const bw=90, gap=16, totalW=opts.length*bw+(opts.length-1)*gap;
  let bx = canvas.width/2 - totalW/2;
  for (const [n,label] of opts) {
    const sel = n===menuSel;
    ctx.fillStyle = sel ? "#ff5db1" : "#232a44";
    roundRect(bx, canvas.height/2-8, bw, 54, 12); ctx.fill();
    ctx.fillStyle = sel ? "#fff" : "#c9d0f0";
    ctx.fillText(label, bx+bw/2, canvas.height/2+25);
    bx += bw+gap;
  }
  ctx.font = "14px system-ui, sans-serif"; ctx.fillStyle = "#8b93b5";
  ctx.fillText("숫자키 1~4 로 인원 선택 후 시작 · 또는 클릭 / Enter", canvas.width/2, canvas.height/2 + 92);
  ctx.textAlign = "left";
}

function drawOver() {
  panel(canvas.width/2, canvas.height/2, 520, 300);
  ctx.textAlign="center";
  const won = game.over === "won";
  ctx.fillStyle = won ? "#a3e635" : "#ff5db1";
  ctx.font = "bold 46px system-ui, sans-serif";
  ctx.fillText(won ? `LEVEL ${game.level} CLEAR!` : "GAME OVER", canvas.width/2, canvas.height/2 - 70);
  ctx.font = "16px system-ui, sans-serif"; ctx.fillStyle="#c9d0f0";
  ctx.fillText(`공개율 ${Math.round(game.ratio*100)}%`, canvas.width/2, canvas.height/2 - 40);

  // ranking by claimed area
  const ranked = [...game.players].sort((a,b)=>b.claimed-a.claimed);
  ctx.font = "18px system-ui, sans-serif";
  let y = canvas.height/2 - 8;
  ranked.forEach((p,i)=>{
    const pct = Math.round(p.claimed/game.totalInterior*100);
    ctx.fillStyle = p.color;
    ctx.fillText(`${i+1}위  ${p.name}  ·  ${pct}%  ·  ♥${Math.max(0,p.lives)}`, canvas.width/2, y);
    y += 30;
  });
  ctx.fillStyle = "#8b93b5"; ctx.font = "14px system-ui, sans-serif";
  ctx.fillText(won ? "Enter: 다음 레벨 · R: 메뉴" : "Enter/R: 메뉴로", canvas.width/2, canvas.height/2 + 110);
  ctx.textAlign="left";
}

function drawCenter(title, sub) {
  panel(canvas.width/2, canvas.height/2, 360, 160);
  ctx.textAlign="center"; ctx.fillStyle="#fff";
  ctx.font="bold 34px system-ui, sans-serif"; ctx.fillText(title, canvas.width/2, canvas.height/2-4);
  ctx.font="15px system-ui, sans-serif"; ctx.fillStyle="#c9d0f0";
  ctx.fillText(sub, canvas.width/2, canvas.height/2+30);
  ctx.textAlign="left";
}

// ---- HUD (DOM chips) ----
let hudBuilt = 0;
function requestHud() {
  if (!game) {
    if (hudEl.dataset.mode !== "menu") { hudEl.innerHTML = `<div class="chip"><div class="top">메뉴에서 인원을 선택하세요</div></div>`; hudEl.dataset.mode="menu"; }
    return;
  }
  if (hudEl.dataset.mode !== "game" || +hudEl.dataset.pc !== game.players.length) {
    hudEl.innerHTML = "";
    for (const p of game.players) {
      const el = document.createElement("div");
      el.className = "chip"; el.dataset.pid = p.id;
      el.innerHTML = `<div class="top"><span class="dot" style="color:${p.color};background:${p.color}"></span>${p.name}</div>
        <div class="bar"><i style="background:${p.color}"></i></div>
        <div class="meta"><span class="pct">0%</span><span class="lives">♥♥♥</span></div>`;
      hudEl.appendChild(el);
    }
    // overall progress chip
    const ov = document.createElement("div");
    ov.className = "chip"; ov.id = "ovchip";
    ov.innerHTML = `<div class="top">진행 · Lv <span id="lvl">1</span></div>
      <div class="bar"><i style="background:#ff5db1"></i></div>
      <div class="meta"><span id="ovpct">0%</span><span>목표 80%</span></div>`;
    hudEl.appendChild(ov);
    hudEl.dataset.mode="game"; hudEl.dataset.pc=game.players.length;
  }
  for (const p of game.players) {
    const el = hudEl.querySelector(`.chip[data-pid="${p.id}"]`);
    if (!el) continue;
    el.classList.toggle("dead", p.out);
    const pct = Math.round(p.claimed/game.totalInterior*100);
    el.querySelector(".pct").textContent = pct + "%";
    el.querySelector(".bar > i").style.width = Math.min(100,pct) + "%";
    el.querySelector(".lives").textContent = p.out ? "OUT" : "♥".repeat(Math.max(0,p.lives));
  }
  const ovpct = Math.round(game.ratio*100);
  document.getElementById("ovpct").textContent = ovpct + "%";
  document.getElementById("lvl").textContent = game.level;
  hudEl.querySelector("#ovchip .bar > i").style.width = Math.min(100, ovpct/TARGET*100) + "%";
}

// ---- small canvas helpers ----
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function panel(cx,cy,w,h){ ctx.fillStyle="rgba(12,15,28,.86)"; roundRect(cx-w/2,cy-h/2,w,h,18); ctx.fill();
  ctx.strokeStyle="rgba(255,93,177,.5)"; ctx.lineWidth=2; ctx.stroke(); }

// ---- audio (tiny WebAudio blips, no assets) ----
function makeAudio(){
  let ac=null;
  const ensure=()=>{ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch{} } return ac; };
  return {
    resume(){ const a=ensure(); if(a&&a.state==="suspended") a.resume(); },
    blip(freq,dur=.08,type="sine"){ const a=ensure(); if(!a) return;
      const o=a.createOscillator(), g=a.createGain();
      o.type=type; o.frequency.value=freq; o.connect(g); g.connect(a.destination);
      g.gain.setValueAtTime(.18,a.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
      o.start(); o.stop(a.currentTime+dur);
    }
  };
}

requestAnimationFrame(frame);
