<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gals Panic — Online Co-op</title>
<style>
  :root { --bg:#0b0d16; --panel:#161a2b; --ink:#e8ebf7; --muted:#8b93b5; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(1200px 800px at 50% -10%, #1a1f38, var(--bg));
         color:var(--ink); font-family:system-ui,"Segoe UI",sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:10px; padding:14px; }
  h1 { margin:2px 0 0; font-size:20px; } h1 span { color:#ff5db1; }
  #hud { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .chip { background:var(--panel); border:1px solid #232a44; border-radius:12px; padding:7px 12px;
          display:flex; flex-direction:column; gap:2px; min-width:150px; }
  .chip .meta { gap:8px; }
  .chip .top { display:flex; align-items:center; gap:7px; font-weight:600; font-size:13px; }
  .chip .dot { width:12px; height:12px; border-radius:4px; box-shadow:0 0 8px currentColor; }
  .chip .meta { font-size:11px; color:var(--muted); display:flex; justify-content:space-between; }
  .chip.dead { opacity:.4; filter:grayscale(1); }
  .chip.me { outline:2px solid #ff5db1; }
  canvas { background:#05060c; border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.5);
           aspect-ratio:2/3; height:min(84vh, 860px); width:auto; max-width:94vw; }
  #help { color:var(--muted); font-size:12px; text-align:center; max-width:640px; line-height:1.5; }
  #status { font-size:13px; color:#ffb400; min-height:18px; }
  kbd { background:#232a44; border-radius:5px; padding:1px 6px; font-size:11px; }
  button { background:#ff5db1; color:#fff; border:0; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }

  /* ---- 초기(타이틀) 화면: "게임 시작"을 누르기 전까지 게임 뷰를 덮는다 ---- */
  #start { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center;
           background:radial-gradient(1200px 800px at 50% -10%, #1a1f38, var(--bg)); }
  #start.hidden { display:none; }
  #start .logo { margin:0; font-size:min(16vw,68px); font-weight:800; letter-spacing:3px;
                 text-shadow:0 6px 34px rgba(255,93,177,.4); }
  #start .logo span { color:#ff5db1; }
  #start .tag { color:var(--muted); font-size:13px; letter-spacing:4px; text-transform:uppercase; margin-top:-6px; }
  #start .card { background:var(--panel); border:1px solid #232a44; border-radius:16px;
                 padding:20px 22px; max-width:420px; width:100%; display:flex; flex-direction:column; gap:14px;
                 box-shadow:0 20px 60px rgba(0,0,0,.5); }
  #start .rules { color:var(--muted); font-size:13px; line-height:1.7; text-align:left; }
  #start .rules b { color:var(--ink); }
  #start input { background:#0e1120; border:1px solid #2a3350; border-radius:10px; color:var(--ink);
                 padding:11px 13px; font-size:15px; outline:none; text-align:center; }
  #start input:focus { border-color:#ff5db1; }
  #start .go { font-size:17px; font-weight:700; padding:13px 16px; border-radius:12px; }
  #start .go:disabled { opacity:.6; cursor:default; }
  #start .err { color:#ff6b6b; font-size:13px; min-height:18px; }
</style>
</head>
<body>
  <div id="start">
    <h1 class="logo">GALS <span>PANIC</span></h1>
    <div class="tag">Online Co-op</div>
    <div class="card">
      <div class="rules">
        <b>방향키</b>로 이동 · 안전지대에서 빈 공간으로 들어가 선을 긋고, 다시 안전지대에 닿으면 안쪽이 열립니다.<br>
        빨간 <b>적</b>이 선에 닿으면 목숨을 잃어요 · 함께 <b>90%</b>를 열면 클리어!<br>
        <b>Shift</b> 질주 · <b>Enter</b> 채팅
      </div>
      <input id="nameInput" maxlength="12" placeholder="플레이어 이름 (선택)" autocomplete="off" />
      <button id="startBtn" class="go">게임 시작</button>
      <div id="startErr" class="err"></div>
    </div>
  </div>

  <h1>GALS <span>PANIC</span> — Online Co-op</h1>
  <div id="status">서버 연결 중…</div>
  <div id="hud"></div>
  <canvas id="c" width="512" height="768"></canvas>
  <div id="help">
    <b>방향키</b>로 이동 — 안전지대에서 빈 공간으로 들어가면 선이 그려지고, 다시 안전지대에 닿으면 안쪽이 점유됩니다.
    빨간 적이 당신의 선에 닿으면 목숨을 잃어요. 다 함께 <b>90%</b>를 열면 클리어!
    <div style="margin-top:6px"><button id="restart" style="display:none">다음/재시작 (Enter)</button></div>
    <div style="margin-top:6px"><input id="chat" maxlength="60" placeholder="Enter 로 채팅… (마커 위 말풍선 3초)" autocomplete="off"
      style="width:min(90vw,380px);background:#161a2b;border:1px solid #232a44;border-radius:8px;color:#e8ebf7;padding:7px 11px;font-size:13px;outline:none" /></div>
  </div>

<script type="module">
import { Client } from "https://esm.sh/colyseus.js@0.15.0";

// 서버 주소를 "이 페이지를 연 origin" 기준으로 자동 결정.
// - 게임 서버(2567)가 이 페이지를 직접 서빙하는 경우(권장): 같은 origin으로 접속.
//   → ngrok/cloudflare 터널 하나(https)로 외부 사용자도 그대로 접속됨. https면 wss로 승격.
// - file:// 로 직접 열었거나 별도 8080 정적 서버로 연 개발용 fallback: 같은 호스트의 :2567.
const WS_URL = (() => {
  if (location.protocol === "https:") return `wss://${location.host}`;
  if (location.protocol === "http:" && location.port !== "8080") return `ws://${location.host}`;
  return `ws://${location.hostname || "localhost"}:2567`;   // file:// or dev 8080 static server
})();
const HTTP_URL = WS_URL.replace(/^ws/, "http");

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const restartBtn = document.getElementById("restart");
const chatInput = document.getElementById("chat");
const bubbles = new Map();   // owner -> { text, until }  speech bubbles over each marker (~3s)
// 초기(타이틀) 화면 요소 — "게임 시작"을 누르기 전까지 서버에 접속하지 않는다.
const startScreen = document.getElementById("start");
const startBtn = document.getElementById("startBtn");
const nameInput = document.getElementById("nameInput");
const startErr = document.getElementById("startErr");

let room = null, state = null, GW = 64, GH = 64;
const img = new Image(); img.crossOrigin = "anonymous"; let imgReady = false;
let imgVersion = 0;   // bumps on every (re)load so the cached grid layer rebuilds
img.onload = () => { imgReady = true; imgVersion++; };
// hidden image used only to warm the browser cache for the NEXT stage during the
// between-stage countdown, so switching to it at round start has no loading hitch.
const preImg = new Image(); preImg.crossOrigin = "anonymous";

// Connects and JOINS the live game. Called only from startGame() (the "게임 시작"
// button), so a player never enters the running match until they choose to. Throws on
// failure so the caller can keep the title screen up and let the player retry.
async function connect(name) {
  const client = new Client(WS_URL);
  room = await client.joinOrCreate("game", { name });
  statusEl.textContent = "접속됨 · 방향키로 플레이하세요";
  // Keep this handler TRIVIAL: just latch the latest state. The heavy per-update work
  // (scanning the 4096-cell trail array, capturing enemy snapshots) is done once per
  // render frame instead — so a burst of queued patches can't pile up scans and stall
  // the main thread (which was making input feel ~1s late on the host).
  room.onStateChange((s) => { state = s; GW = s.gridW; GH = s.gridH; });
  room.state.listen?.("imageId", (v) => { if (v) img.src = `${HTTP_URL}/images/${v}_blur.jpg`; });
  // preload the next stage's image during the countdown → next round starts hitch-free
  room.state.listen?.("nextImageId", (v) => { if (v) preImg.src = `${HTTP_URL}/images/${v}_blur.jpg`; });
  // capture popups: server broadcasts one per trapped-monster batch
  room.onMessage("trap", (ev) => {
    flashes.push({
      x: ev.x, y: ev.y, color: playerColor(ev.owner), life: 1.2, ttl: 1.2,
      text: ev.count > 1 ? `포획 x${ev.count}! +${ev.bonus}` : `포획! +${ev.bonus}`,
    });
  });
  // chat: show a speech bubble over the sender's marker for ~3s
  room.onMessage("chat", (ev) => { bubbles.set(ev.owner, { text: ev.text, until: performance.now() + 3000 }); });
}

// ---- 초기 화면: "게임 시작"을 눌러야 접속·합류한다 ----
try { nameInput.value = localStorage.getItem("galspanic:name") || ""; } catch {}
async function startGame() {
  if (startBtn.disabled) return;
  const name = (nameInput.value || "").trim().slice(0, 12) || "Guest";
  try { localStorage.setItem("galspanic:name", name === "Guest" ? "" : name); } catch {}
  startBtn.disabled = true; startBtn.textContent = "접속 중…"; startErr.textContent = "";
  try {
    await connect(name);
    startScreen.classList.add("hidden");   // 접속에 성공했을 때만 게임 화면을 드러낸다
  } catch (e) {
    console.error(e);
    startErr.textContent = "서버 연결 실패 — server 폴더에서 npm start 후 다시 시도하세요";
    startBtn.disabled = false; startBtn.textContent = "게임 시작";
  }
}
startBtn.addEventListener("click", startGame);
// 이름 칸에서 Enter 로도 시작 (IME 조합 중 Enter 는 무시 — 부분 입력 방지)
nameInput.addEventListener("keydown", (e) => {
  e.stopPropagation();
  if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) startGame();
});
nameInput.focus();

// ---- input: send held direction (0..4) on change ----
const CODE_DIR = {
  ArrowUp:1, KeyW:1, ArrowDown:2, KeyS:2, ArrowLeft:3, KeyA:3, ArrowRight:4, KeyD:4,
};
const pressOrder = [];
let lastSentDir = -1, lastSentBoost = false, boostHeld = false;
function currentDir() {
  let dir = 0;
  for (const code of pressOrder) if (CODE_DIR[code] != null) dir = CODE_DIR[code];
  return dir;
}
function syncInput() {
  const d = currentDir();
  if ((d !== lastSentDir || boostHeld !== lastSentBoost) && room) {
    room.send("input", { dir: d, boost: boostHeld });
    lastSentDir = d; lastSentBoost = boostHeld;
  }
}
window.addEventListener("keydown", (e) => {
  const ae = document.activeElement;
  if (ae === chatInput || ae === nameInput) return;   // typing in a text field: let it handle keys
  if (CODE_DIR[e.code] != null || e.code === "Enter") e.preventDefault();
  if (e.repeat) return;                       // ignore OS key auto-repeat
  if (e.code === "Enter") {
    // while playing, Enter opens the chat box; on win/loss it restarts
    if (state && state.phase === "playing") { releaseAllKeys(); chatInput.focus(); return; }
    room?.send("restart"); return;
  }
  if (e.code === "ShiftLeft" || e.code === "ShiftRight") { boostHeld = true; syncInput(); return; }
  if (!pressOrder.includes(e.code)) pressOrder.push(e.code);
  syncInput();
});
window.addEventListener("keyup", (e) => {
  const ae = document.activeElement;
  if (ae === chatInput || ae === nameInput) return;
  if (e.code === "ShiftLeft" || e.code === "ShiftRight") { boostHeld = false; syncInput(); return; }
  const i = pressOrder.indexOf(e.code); if (i >= 0) pressOrder.splice(i, 1);
  syncInput();
});
// chat box: Enter sends + closes, Escape cancels (control returns to the game)
chatInput.addEventListener("keydown", (e) => {
  e.stopPropagation();
  // Ignore Enter while an IME (Korean/Japanese/etc.) is still composing — that Enter
  // only commits the composition. Sending then would grab a partial value (the
  // "only one character" bug). Send on the next, non-composing Enter.
  if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) {
    const t = chatInput.value.trim();
    if (t && room) room.send("chat", { text: t });
    chatInput.value = ""; chatInput.blur();
  } else if (e.key === "Escape") { chatInput.value = ""; chatInput.blur(); }
});
// losing focus drops all held keys and tells the server to stop, so the marker
// never keeps moving in the last direction after a missed keyup.
function releaseAllKeys(){ pressOrder.length = 0; boostHeld = false; syncInput(); }
window.addEventListener("blur", releaseAllKeys);
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAllKeys(); });
restartBtn.onclick = () => room?.send("restart");

// ---- render ----
function playerColor(owner) {
  const cs = ["#22d3ee","#f472b6","#a3e635","#fb923c"];
  return cs[(owner - 1) % cs.length] || "#fff";
}

// monster archetype colors (kind -> color); shape comes from the synced e.shape
const KIND_COLOR = {
  star:"#ff3b5c", saw:"#f59e0b", blob:"#a855f7", ghost:"#e0e7ff", gunner:"#ef4444", dart:"#22d3ee",
};
const flashes = [];   // capture popups {x,y,text,color,life,ttl}, fed by the "trap" broadcast

function spikePath(points, R, inner) {
  ctx.beginPath();
  for (let k = 0; k < points*2; k++) {
    const a = k*Math.PI/points, r = k%2 ? R : R*inner;
    const x = Math.cos(a)*r, y = Math.sin(a)*r;
    k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function enemyEyes(R) {
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(-R*0.2,-R*0.15,R*0.2,0,7); ctx.arc(R*0.25,-R*0.15,R*0.2,0,7); ctx.fill();
  ctx.fillStyle = "#111";
  ctx.beginPath(); ctx.arc(-R*0.2,-R*0.15,R*0.1,0,7); ctx.arc(R*0.25,-R*0.15,R*0.1,0,7); ctx.fill();
}
// draw one enemy at screen px (px,py); shape/kind/r/aim come from the synced schema
function drawEnemy(px, py, e, R, spin) {
  const color = KIND_COLOR[e.kind] || "#ff3b5c";
  ctx.save();
  ctx.translate(px, py);
  ctx.fillStyle = color;   // shadowBlur removed — it's a canvas perf killer (per-enemy gaussian blur)
  if (e.shape === "triangle") {
    ctx.save(); ctx.rotate((e.aim||0) + Math.PI/2);
    ctx.beginPath(); ctx.moveTo(0,-R*1.1); ctx.lineTo(R*0.85,R*0.8); ctx.lineTo(-R*0.85,R*0.8); ctx.closePath(); ctx.fill();
    ctx.restore(); ctx.shadowBlur = 0; enemyEyes(R*0.85);
  } else if (e.shape === "saw") {
    ctx.save(); ctx.rotate(spin); spikePath(11, R, 0.72); ctx.fill(); ctx.restore();
    ctx.shadowBlur = 0; ctx.fillStyle = "#1a1206"; ctx.beginPath(); ctx.arc(0,0,R*0.4,0,7); ctx.fill(); enemyEyes(R);
  } else if (e.shape === "blob") {
    ctx.beginPath();
    for (let a=0;a<=Math.PI*2+0.01;a+=0.4){ const rr=R*(1+0.14*Math.sin(a*3+spin)); const x=Math.cos(a)*rr,y=Math.sin(a)*rr*0.9; a===0?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; enemyEyes(R);
  } else if (e.shape === "ghost") {
    ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.arc(0,-R*0.1,R,Math.PI,0);
    const feet=4, w=R*2/feet; for(let f=0;f<feet;f++){const x0=R-f*w; ctx.lineTo(x0,R*0.7); ctx.quadraticCurveTo(x0-w/2,R,x0-w,R*0.7);} ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0; enemyEyes(R);
  } else if (e.shape === "turret") {
    ctx.save(); ctx.rotate(e.aim||0); ctx.fillStyle="#7f1d1d"; ctx.fillRect(0,-R*0.26,R*1.7,R*0.52); ctx.restore();
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = "#3f0d0d"; ctx.beginPath(); ctx.arc(0,0,R*0.55,0,7); ctx.fill(); enemyEyes(R);
  } else {
    ctx.save(); ctx.rotate(spin); spikePath(4, R, 0.55); ctx.fill(); ctx.restore(); ctx.shadowBlur = 0; enemyEyes(R);
  }
  ctx.restore();
}

// ---- interpolation ----
// The server sends discrete grid positions. Rendering them raw looks stepped, so we
// smooth motion on the client: enemies (which update every tick) use exponential
// easing; players (which jump a whole cell every MOVE_MS) use constant-velocity linear
// interpolation — see below. (Client-side prediction was tried and removed: on LAN the
// round trip it hides is negligible while its float-ahead/snap-back artifacts are not.)
const TAU = 0.05;                    // enemies: exponential smoothing (they update ~60Hz)
const enemyView = [];                // smoothed enemy positions, index-aligned
let lastFrame = performance.now();

function ease(cur, tgt, dt, tau) { return cur + (tgt - cur) * (1 - Math.exp(-dt / tau)); }
// ease toward target, but hard-snap on big jumps (respawn / round reset / enemy spawn)
function follow(v, tx, ty, dt, tau = TAU) {
  if (Math.abs(v.x - tx) + Math.abs(v.y - ty) > 6) { v.x = tx; v.y = ty; }
  else { v.x = ease(v.x, tx, dt, tau); v.y = ease(v.y, ty, dt, tau); }
}

// ---- snapshot-buffer interpolation for enemies (the standard "render in the past") ----
// Each server patch is buffered with a receive timestamp; enemies are drawn at
// (now - SNAP_DELAY) by interpolating between the two snapshots bracketing that time.
// This absorbs update jitter far better than easing toward the latest value, at the
// cost of showing enemies a few tens of ms in the past.
const SNAP_DELAY = 80;               // ms interpolation buffer
const snaps = [];                    // [{ t, ex:[x0,y0,x1,y1,...] }]

// Active trail cells as a flat [index, owner, index, owner, ...] list, rebuilt on
// each server patch. Rendering iterates this (O(trail length)) instead of scanning
// all GW*GH cells every frame — so per-frame cost no longer grows with map size.
let trailList = [];
function syncTrail() {
  if (!state) return;
  // Copy the Colyseus ArraySchema to a plain array ONCE (iterator traversal), then scan
  // that. Random-indexing an ArraySchema (state.trail[i]) goes through a Proxy get-trap
  // that costs ~11µs/element — scanning GW*GH of them every frame was ~73ms (13fps) on the
  // 80x80 grid. A one-shot spread copy is ~0.1ms and the plain-array scan ~0.04ms, so this
  // is ~500x cheaper and keeps per-frame cost flat as the map grows.
  const t = [...state.trail], n = t.length, list = [];
  for (let i = 0; i < n; i++) { const o = t[i]; if (o) { list.push(i, o); } }
  trailList = list;
}
function captureSnapshot() {
  if (!state) return;
  const ex = [];
  state.enemies.forEach((e) => { ex.push(e.x, e.y); });
  snaps.push({ t: performance.now(), ex });
  const cutoff = performance.now() - 1000;
  while (snaps.length > 3 && snaps[0].t < cutoff) snaps.shift();
}
function enemyBracket(renderT) {
  if (snaps.length === 0) return null;
  let i = snaps.length - 1;
  while (i > 0 && snaps[i].t > renderT) i--;
  const a = snaps[i], b = snaps[i + 1] || a;
  const span = b.t - a.t;
  const alpha = span > 0 ? Math.max(0, Math.min(1, (renderT - a.t) / span)) : 1;
  return { a: a.ex, b: b.ex, alpha };
}
// interpolated position for enemy index i (fallback to live x,y; snap on reindex/respawn)
function enemyPos(br, i, live) {
  if (!br || br.a.length <= i*2+1 || br.b.length <= i*2+1) return live;
  const ax = br.a[i*2], ay = br.a[i*2+1], bx = br.b[i*2], by = br.b[i*2+1];
  if (Math.abs(bx - ax) + Math.abs(by - ay) > 6) return { x: bx, y: by };
  return { x: ax + (bx - ax) * br.alpha, y: ay + (by - ay) * br.alpha };
}

// Players jump a whole cell every MOVE_MS (~45ms). We glide the marker toward the CURRENT
// server cell over exactly one step, so it lags the head by at most one cell and settles
// right on it at rest. The remaining sub-cell gap is hidden by NOT drawing each player's
// newest (head) trail cell — the moving marker stands in for the line's tip, and each
// cell solidifies into the line as the marker passes it (like the arcade line growing).
const STEP_MS = 48;                  // fallback for state.moveMs (matches server MOVE_MS)
const pmove = new Map();             // id -> { px, py, cx, cy, t0 }
const prevMarker = new Map();        // id -> { x, y } last frame's render pos (for boost streaks)
function playerRenderPos(id, sx, sy, now) {
  let m = pmove.get(id);
  if (!m) { m = { px: sx, py: sy, cx: sx, cy: sy, t0: now - 1e4 }; pmove.set(id, m); return { x: sx, y: sy }; }
  const glide = (state.moveMs || STEP_MS);   // glide one full step → constant-velocity, no pause
  if (sx !== m.cx || sy !== m.cy) {           // server advanced to a new cell
    if (Math.abs(sx - m.cx) + Math.abs(sy - m.cy) > 1) {   // teleport / respawn → snap
      m.px = sx; m.py = sy;
    } else {
      // Continue from the CURRENT displayed position (not the old target cell) so motion
      // is seamless even when the previous glide hadn't finished — the marker keeps
      // tracking the latest cell smoothly, with no mid-step jump or "arrive-then-pause".
      const u = Math.min(1, (now - m.t0) / glide);
      m.px = m.px + (m.cx - m.px) * u;
      m.py = m.py + (m.cy - m.py) * u;
    }
    m.cx = sx; m.cy = sy; m.t0 = now;
  }
  const u = Math.min(1, (now - m.t0) / glide);
  return { x: m.px + (m.cx - m.px) * u, y: m.py + (m.cy - m.py) * u };
}


// The grid (claimed art vs dark empty) only changes on a claim — rare — but drawing it
// is the one cost that scales (up to GW*GH drawImage slices once a photo is revealed).
// So we cache it on an offscreen canvas and rebuild ONLY when it actually changed, then
// blit once per frame. Trails/enemies/players (which move) are still drawn live on top.
const gridCanvas = document.createElement("canvas");
const gctx = gridCanvas.getContext("2d");
let gridBuilt = false, lastClaimed = -1, lastLevel = -1, lastImgVer = -1, lastGW = 0, lastGH = 0;
function rebuildGrid() {
  const W = canvas.width, H = canvas.height, cw = W / GW, ch = H / GH;
  if (gridCanvas.width !== W || gridCanvas.height !== H) { gridCanvas.width = W; gridCanvas.height = H; }
  // one-shot plain-array copy — see syncTrail(): indexing the ArraySchema per cell is ~500x slower
  const cells = [...state.cells];
  for (let i = 0; i < cells.length; i++) {
    const cx = i % GW, cy = (i / GW) | 0;
    if (cells[i] === 1) {
      if (imgReady) gctx.drawImage(img, cx*(img.width/GW), cy*(img.height/GH), img.width/GW, img.height/GH,
                                   cx*cw, cy*ch, cw+1, ch+1);
      else { gctx.fillStyle = "#2a3350"; gctx.fillRect(cx*cw, cy*ch, cw+1, ch+1); }
    } else {
      gctx.fillStyle = "#080a14"; gctx.fillRect(cx*cw, cy*ch, cw+1, ch+1);
    }
  }
  gridBuilt = true;
}

function bubbleRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
// Greedy wrap into lines that each fit maxWidth. Breaks on spaces when possible
// (English) and falls back to per-character breaks for long/space-less runs (Korean).
// ctx.font must already be set to the measuring font.
function wrapText(text, maxWidth) {
  const lines = [];
  let line = "";
  const flush = () => { if (line) { lines.push(line); line = ""; } };
  for (const word of text.split(" ")) {
    let w = word;
    // A single token wider than the box: char-break it (also handles Korean/CJK).
    while (ctx.measureText(w).width > maxWidth && w.length > 1) {
      let i = 1;
      while (i < w.length && ctx.measureText(w.slice(0, i + 1)).width <= maxWidth) i++;
      flush();
      lines.push(w.slice(0, i));
      w = w.slice(i);
    }
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width <= maxWidth) line = test;
    else { flush(); line = w; }
  }
  flush();
  return lines.length ? lines : [text];
}

function drawBubble(cx, markerY, text, color, alpha) {
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  ctx.font = "600 13px system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const padX = 10, padY = 6, lineH = 17, maxW = 240, gap = 13, maxLines = 6;
  let lines = wrapText(text, maxW - padX * 2);
  if (lines.length > maxLines) {                                       // cap very long messages
    lines = lines.slice(0, maxLines);
    lines[maxLines - 1] = lines[maxLines - 1].slice(0, -1) + "…";
  }
  const textW = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = Math.ceil(textW) + padX * 2;
  const h = lines.length * lineH + padY * 2;
  const bx = Math.max(4, Math.min(cx - w/2, canvas.width - w - 4));   // clamp on-screen
  const above = markerY - (h + gap) > 2;                               // room above the marker?
  const y = above ? markerY - h - gap : markerY + gap;
  const tipX = Math.max(bx + 10, Math.min(cx, bx + w - 10));
  const fill = "rgba(18,22,38,0.94)";
  ctx.fillStyle = fill;
  ctx.beginPath();                                                     // tail toward the marker
  if (above) { ctx.moveTo(tipX-6, y+h-1); ctx.lineTo(tipX+6, y+h-1); ctx.lineTo(tipX, y+h+7); }
  else       { ctx.moveTo(tipX-6, y+1);   ctx.lineTo(tipX+6, y+1);   ctx.lineTo(tipX, y-7); }
  ctx.closePath(); ctx.fill();
  bubbleRect(bx, y, w, h, 9);
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = "#eef1fb";
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], bx + w/2, y + padY + lineH * i + lineH/2);
  }
  ctx.restore();
}

function render() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now;
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  if (state && state.cells.length) {
    const cw = W / GW, ch = H / GH;
    // per-frame (not per-patch): capped so queued patches can't pile up scans and stall
    captureSnapshot();   // enemy snapshot for interpolation
    syncTrail();         // rebuild the active-trail list from the grid
    // rebuild the cached grid layer only when it changed (claim / new level / image load / resize)
    if (state.claimedInterior !== lastClaimed || state.level !== lastLevel ||
        imgVersion !== lastImgVer || GW !== lastGW || GH !== lastGH) {
      rebuildGrid();
      lastClaimed = state.claimedInterior; lastLevel = state.level;
      lastImgVer = imgVersion; lastGW = GW; lastGH = GH;
    }
    // ---- self-centered camera: ~VIEW cells across, follows my predicted marker ----
    let me = null;
    if (room) state.players.forEach((p) => { if (p.id === room.sessionId) me = p; });
    let camS = 1, camX = 0, camY = 0, myPos = null;
    if (me && !me.out) {
      const VIEW = Math.min(GW, GH, 117);           // cells across the shorter side (higher = zoomed out)
      camS = Math.min(GW, GH) / VIEW;               // zoom factor (~2.19x on the 256 grid — zoomed
                                                    // back in 1.5x from VIEW=176 for a closer view)
      // On low latency (localhost/LAN) prediction only adds snap-back jitter, so
      // render my own marker with the same smooth server interpolation as everyone
      // else. (Prediction is worth re-enabling only for a high-latency remote server,
      // and then only with sequence-based reconciliation to avoid the bounce.)
      myPos = playerRenderPos(me.id, me.x, me.y, now);
      const vpx = W / camS, vpy = H / camS;
      camX = Math.max(0, Math.min(myPos.x*cw + cw/2 - vpx/2, W - vpx));
      camY = Math.max(0, Math.min(myPos.y*ch + ch/2 - vpy/2, H - vpy));
    }
    ctx.save();
    ctx.translate(-camX*camS, -camY*camS); ctx.scale(camS, camS);

    if (gridBuilt) ctx.drawImage(gridCanvas, 0, 0);   // one blit instead of GW*GH draws
    // trails — draw ONLY the active trail cells (built on each patch), so per-frame
    // cost is O(trail length), independent of map size. Skip each player's newest
    // (head) cell; the moving marker stands in for the line's tip.
    const heads = new Set();
    state.players.forEach((p) => { if (!p.out) heads.add(p.y * GW + p.x); });
    for (let k = 0; k < trailList.length; k += 2) {
      const i = trailList[k];
      if (heads.has(i)) continue;
      const cx = i % GW, cy = (i / GW) | 0;
      ctx.fillStyle = playerColor(trailList[k + 1]);
      ctx.fillRect(cx*cw, cy*ch, cw+1, ch+1);
    }
    // enemies — snapshot-buffer interpolation (render ~SNAP_DELAY ms in the past)
    const spin = now / 120;
    const br = enemyBracket(now - SNAP_DELAY);
    state.enemies.forEach((e, i) => {
      const v = enemyPos(br, i, e);
      drawEnemy(v.x*cw, v.y*ch, e, (e.r || 1) * cw, spin);
    });
    // gunner bullets — ignore walls & safe zone; lethal on any contact
    state.projectiles.forEach((pr) => {
      const x = pr.x*cw, y = pr.y*ch, R = cw*0.9;
      ctx.save();
      ctx.fillStyle = "#ffe066";
      ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x-R*0.25, y-R*0.25, R*0.4, 0, 7); ctx.fill();
      ctx.restore();
    });
    // players — every marker glides at constant velocity toward the latest server cell,
    // continuously tracking it for smooth motion. (Path prediction stays out: with a
    // server-owned trail it detaches the marker from its line on direction changes.)
    const pulse = 0.5 + 0.5 * Math.sin(now / 150);   // 0..1 blink, ~1.1 Hz
    state.players.forEach((p) => {
      if (p.out) { pmove.delete(p.id); prevMarker.delete(p.id); return; }
      const pos = playerRenderPos(p.id, p.x, p.y, now);
      const vx = pos.x, vy = pos.y;
      const isMe = room && p.id === room.sessionId;
      // Sprint (Shift) speed streaks: fading afterimages trailing behind the marker.
      const prev = prevMarker.get(p.id);
      if (p.boosting && prev) {
        const dx = vx - prev.x, dy = vy - prev.y, mag = Math.hypot(dx, dy);
        if (mag > 0.0015) {
          const ux = dx / mag, uy = dy / mag;
          ctx.save();
          ctx.fillStyle = p.color;
          for (let s = 1; s <= 4; s++) {
            ctx.globalAlpha = 0.30 * (1 - s / 5);
            ctx.fillRect((vx - ux * s * 1.7) * cw, (vy - uy * s * 1.7) * ch, cw + 1, ch + 1);
          }
          ctx.restore();
        }
      }
      prevMarker.set(p.id, { x: vx, y: vy });
      // Blinking halo so the marker stays easy to spot even when the map is zoomed out and
      // the cell is only a few px. Sized in SCREEN px (÷camS) so it's consistent at any zoom.
      const cxp = (vx + 0.5) * cw, cyp = (vy + 0.5) * ch;
      const r = ((isMe ? 7 : 5) + pulse * 3) / camS;
      ctx.save();
      ctx.globalAlpha = 0.18 + 0.62 * pulse;
      ctx.strokeStyle = p.color;                     // blink in each player's own color
      ctx.lineWidth = (isMe ? 3 : 2.2) / camS;       // own marker gets a thicker, larger halo to stand out
      ctx.strokeRect(cxp - r, cyp - r, r * 2, r * 2);
      ctx.restore();
      ctx.fillStyle = "#fff"; ctx.fillRect(vx*cw-1, vy*ch-1, cw+2, ch+2);
      ctx.fillStyle = p.color; ctx.fillRect(vx*cw, vy*ch, cw+1, ch+1);
    });
    // capture popups
    for (let i = flashes.length-1; i >= 0; i--) {
      const f = flashes[i]; f.life -= dt;
      if (f.life <= 0) { flashes.splice(i, 1); continue; }
      const a = f.life / f.ttl;
      ctx.save();
      ctx.globalAlpha = a; ctx.textAlign = "center";
      ctx.font = "bold 18px system-ui, sans-serif";
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x*cw, f.y*ch - (1-a)*20);
      ctx.restore();
    }
    ctx.restore();          // end camera transform (HUD/overlay stay in screen space)

    // chat speech bubbles — drawn in SCREEN space above each marker (consistent text
    // size at any zoom), auto-expiring ~3s after the message.
    state.players.forEach((p) => {
      if (p.out) return;
      const b = bubbles.get(p.owner);
      if (!b) return;
      if (b.until <= now) { bubbles.delete(p.owner); return; }
      const pos = playerRenderPos(p.id, p.x, p.y, now);
      const sx = ((pos.x + 0.5) * cw - camX) * camS;      // marker centre → screen px
      const sy = (pos.y * ch - camY) * camS;
      if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) return;
      drawBubble(sx, sy, b.text, p.color, Math.min(1, (b.until - now) / 500));  // fade last 0.5s
    });

    drawHud();
    if (state.phase === "won") drawWinCelebration(now, dt);
    else { wonCelebActive = false; if (state.phase === "lost") drawOverlay(); }
  }
  requestAnimationFrame(render);
}

const WIN_COUNTDOWN_S = 5;   // matches the server's between-stage countdown
function drawOverlay() {
  const W = canvas.width, H = canvas.height;
  const won = state.phase === "won";
  ctx.fillStyle = "rgba(8,10,20,.82)";
  ctx.fillRect(W/2-190, H/2-80, 380, won ? 176 : 140);
  ctx.textAlign = "center";
  ctx.fillStyle = won ? "#a3e635" : "#ff5db1";
  ctx.font = "bold 34px system-ui";
  ctx.fillText(won ? `LEVEL ${state.level} CLEAR!` : "GAME OVER", W/2, H/2-22);
  if (won) {
    const remain = Math.max(0, state.nextIn || 0);
    const prog = Math.min(1, Math.max(0, 1 - remain / WIN_COUNTDOWN_S));   // bar fills over the countdown
    const bw = 300, bh = 14, bx = W/2 - bw/2, by = H/2 + 6;
    ctx.fillStyle = "#1b2138"; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = "#a3e635"; ctx.fillRect(bx, by, bw * prog, bh);
    ctx.strokeStyle = "#3a4670"; ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = "#c9d0f0"; ctx.font = "14px system-ui";
    ctx.fillText(`다음 스테이지까지 ${Math.ceil(remain)}초`, W/2, by + bh + 24);
  } else {
    ctx.fillStyle = "#c9d0f0"; ctx.font = "14px system-ui";
    ctx.fillText("Enter 로 재시작", W/2, H/2 + 24);
  }
  ctx.textAlign = "left";
}

// ---- stage-clear celebration: full-screen picture reveal + fireworks ----
let fwParticles = [];
let fwLastBurst = 0;
let wonCelebActive = false;
const FW_COLORS = ["#ff5db1", "#a3e635", "#22d3ee", "#fb923c", "#ffe066", "#c084fc", "#ffffff"];
function spawnBurst(x, y) {
  const n = 26 + (Math.random() * 18 | 0);
  const color = FW_COLORS[Math.random() * FW_COLORS.length | 0];
  const base = 120 + Math.random() * 150;   // px/s
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.25;
    const s = base * (0.55 + Math.random() * 0.6);
    fwParticles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 1, ttl: 0.9 + Math.random() * 0.7, color, r: 2 + Math.random() * 2.2 });
  }
}
function drawWinCelebration(now, dt) {
  const W = canvas.width, H = canvas.height;
  // 불투명 배경으로 게임 화면을 완전히 덮는다
  ctx.fillStyle = "#07090f"; ctx.fillRect(0, 0, W, H);

  // 아래쪽에 불투명 배너 자리를 남기고, 그 위 영역에 그림 "전체"를 비율 유지로 최대한 크게 보여준다
  const barH = 100, areaH = H - barH;
  if (imgReady && img.width && img.height) {
    const scale = Math.min(W / img.width, areaH / img.height);   // contain — 왜곡 없이 전체 표시
    const dw = img.width * scale, dh = img.height * scale;
    ctx.drawImage(img, 0, 0, img.width, img.height, (W - dw) / 2, (areaH - dh) / 2, dw, dh);
  } else {
    ctx.fillStyle = "#2a3350"; ctx.fillRect(0, 0, W, areaH);
  }

  // fireworks: (re)start on entering the won phase, then burst on an interval (그림 영역 위에서만)
  if (!wonCelebActive) { wonCelebActive = true; fwParticles.length = 0; fwLastBurst = 0; }
  if (now - fwLastBurst > 400) {
    fwLastBurst = now;
    spawnBurst(W * (0.12 + Math.random() * 0.76), areaH * (0.1 + Math.random() * 0.5));
  }
  for (let i = fwParticles.length - 1; i >= 0; i--) {
    const p = fwParticles[i];
    p.life -= dt / p.ttl;
    if (p.life <= 0) { fwParticles.splice(i, 1); continue; }
    p.vy += 320 * dt;                       // gravity
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y > areaH) continue;              // 배너 위로는 그리지 않음
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---- 불투명 CLEAR 배너: 하단 가로 막대 (그림을 가리지 않는다) ----
  const barY = H - barH;
  ctx.fillStyle = "#0b0e1a"; ctx.fillRect(0, barY, W, barH);                 // 완전 불투명 막대
  ctx.strokeStyle = "#a3e635"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, barY + 1); ctx.lineTo(W, barY + 1); ctx.stroke();   // 상단 강조선
  ctx.textAlign = "center";
  ctx.fillStyle = "#a3e635"; ctx.font = "bold 32px system-ui";
  ctx.fillText(`LEVEL ${state.level} CLEAR!`, W / 2, barY + 38);
  const remain = Math.max(0, state.nextIn || 0);
  const prog = Math.min(1, Math.max(0, 1 - remain / WIN_COUNTDOWN_S));
  const bw = 340, bh = 12, bx = W / 2 - bw / 2, by = barY + 56;
  ctx.fillStyle = "#1b2138"; ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = "#a3e635"; ctx.fillRect(bx, by, bw * prog, bh);
  ctx.strokeStyle = "#3a4670"; ctx.lineWidth = 1; ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = "#c9d0f0"; ctx.font = "13px system-ui";
  ctx.fillText(`다음 스테이지까지 ${Math.ceil(remain)}초`, W / 2, by + bh + 16);
  ctx.textAlign = "left";
}

function drawHud() {
  const hud = document.getElementById("hud");
  const total = state.totalInterior || 1;
  const ratio = Math.round(state.claimedInterior / total * 100);
  let html = "";
  state.players.forEach((p) => {
    const me = room && p.id === room.sessionId;
    const pct = Math.round(p.claimed / total * 100);
    const traps = p.traps ? `🕸${p.traps}` : "";
    const score = p.bonus | 0;   // 점수: 포획으로 획득(등급별) · Shift 질주로 소모
    html += `<div class="chip ${p.out ? "dead" : ""} ${me ? "me" : ""}">
      <div class="top"><span class="dot" style="color:${p.color};background:${p.color}"></span>${p.name}${me?" (나)":""}</div>
      <div class="meta"><span style="color:#ffd54a">⭐${score}</span><span>${pct}%</span><span>${traps}</span><span>${p.out?"OUT":"♥"+p.lives}</span></div></div>`;
  });
  html += `<div class="chip"><div class="top">진행 · Lv ${state.level}</div>
    <div class="meta"><span>${ratio}%</span><span>목표 90%</span></div></div>`;
  hud.innerHTML = html;
  restartBtn.style.display = (state.phase === "won" || state.phase === "lost") ? "" : "none";
  // 클리어(승리) 화면에서는 채팅 입력창을 숨긴다
  chatInput.style.display = (state.phase === "won") ? "none" : "";
  if (state.phase === "won" && document.activeElement === chatInput) chatInput.blur();
}
render();
</script>
</body>
</html>
