<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보스 3D 미리보기</title>
<style>
  html,body{margin:0;min-height:100%;background:radial-gradient(1100px 760px at 50% -10%, #171c30, #0a0d18);
    color:#e8ebf7;font-family:system-ui,-apple-system,sans-serif;}
  h1{text-align:center;font-size:20px;font-weight:800;margin:18px 0 2px;}
  .sub{text-align:center;color:#9fb0d6;font-size:13px;margin-bottom:10px;}
  #stage{position:relative;width:min(560px,94vw);margin:0 auto 40px;}
  #c{display:block;width:100%;aspect-ratio:2/3;background:rgba(12,16,30,.45);border-radius:16px;border:1px solid #232a44;}
  #fx3dShatter{position:fixed;pointer-events:none;}
  .lbl{position:fixed;transform:translate(-50%,0);text-align:center;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.85);white-space:nowrap;}
  .lbl .rc{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;}
  .lbl .n{font-weight:800;font-size:15px;margin-top:1px;}
  .lbl .d{font-size:11px;color:#9fb0d6;margin-top:1px;}
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head><body>
<h1>보스 3D 미리보기</h1>
<div class="sub">4종 보스 · 각자 다른 모양 · 움직임 · 공격 라인 (실시간 렌더)</div>
<div style="text-align:center;margin-bottom:12px">
  <button id="fireBtn" style="background:linear-gradient(90deg,#ff5db1,#ff8a3b);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:800;cursor:pointer">⚡ 레이저 발사 효과</button>
</div>
<div id="stage"><canvas id="c" width="512" height="768"></canvas></div>
<canvas id="fx3dShatter"></canvas>
<script type="module">
import { updateBoss3D, renderShatter } from "./shatter3d.js";
const BOSSES = [
  { id:1, kind:"boss_ring",   col:"#ff5db1", x:0.28, y:0.24, rc:"방사포", n:"기어 링", d:"확산 파동 · 360° 레이저" },
  { id:2, kind:"boss_spiral", col:"#22d3ee", x:0.72, y:0.24, rc:"나선",   n:"꼬인 매듭", d:"양방향 나선 · 유도 · 거미줄" },
  { id:3, kind:"boss_spread", col:"#a3e635", x:0.28, y:0.66, rc:"돌격",   n:"화살촉",   d:"조준 돌진 · 포식 · 순간이동" },
  { id:4, kind:"boss_cross",  col:"#fb923c", x:0.72, y:0.66, rc:"십자",   n:"회전 십자", d:"십자 레이저 · 오염 · 소환" },
];
const c = document.getElementById("c");
for (const b of BOSSES) {
  const el = document.createElement("div"); el.className = "lbl";
  el.innerHTML = `<div class="rc" style="color:${b.col}">${b.rc}</div><div class="n">${b.n}</div><div class="d">${b.d}</div>`;
  document.body.appendChild(el); b.el = el;
}
function place() {
  const r = c.getBoundingClientRect(), rad = r.width * 96 / 512;   // 화면상 보스 반경(px)
  for (const b of BOSSES) { b.el.style.left = (r.left + r.width * b.x) + "px"; b.el.style.top = (r.top + r.height * b.y + rad + 10) + "px"; }
}
// 발사 이펙트 토글: 켜면 모든 보스가 발사(충전 발광) 상태로 렌더된다(십자 보스는 회전도 멈춤).
let firing = false;
const fireBtn = document.getElementById("fireBtn");
fireBtn.addEventListener("click", () => {
  firing = !firing;
  fireBtn.textContent = firing ? "⏹ 발사 멈추기" : "⚡ 레이저 발사 효과";
  fireBtn.style.filter = firing ? "brightness(1.15)" : "";
});
let last = performance.now();
function loop() {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const b of BOSSES) {
    const aim = b.kind === "boss_spread" ? now / 1500 : 0;   // 화살촉은 조준을 천천히 돌려 사이트 라인을 보여준다
    updateBoss3D(b.id, 512 * b.x, 768 * b.y, 96, 0, b.col, b.kind, aim, firing);
  }
  renderShatter(dt); place(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
addEventListener("resize", place);
</script></body></html>
