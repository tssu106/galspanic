<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>One More Inch (한뼘더) — Online Co-op</title>
<!-- ── 구글 애드센스 (H5 Games Ads · 스테이지 클리어 전면광고) ──────────────────────
     본인 AdSense 퍼블리셔 ID(ca-pub-...)를 아래 ADSENSE_CLIENT 에 넣으면, 스테이지 클리어 후
     다음 스테이지로 넘어갈 때 전면(인터스티셜) 광고가 뜹니다. 비워두면 광고 비활성(게임 정상 동작).
     전제: (1) 공개 도메인에서 서비스 + AdSense 사이트 승인, (2) 계정에 H5 Games Ads(전면/보상형)
     사용 설정. 개발 중에는 localhost/file:// 에서 실제 광고가 뜨지 않습니다(코드/흐름만 확인 가능). -->
<script>
  window.ADSENSE_CLIENT = "";   // 예: "ca-pub-1234567890123456"  (비우면 광고 비활성)
  window.AD_FROM_STAGE  = 2;    // 이 스테이지 클리어부터 광고 노출 (1스테이지 클리어는 제외)
  window.adsbygoogle = window.adsbygoogle || [];
  if (window.ADSENSE_CLIENT) {
    const s = document.createElement("script");
    s.async = true; s.crossOrigin = "anonymous";
    s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + window.ADSENSE_CLIENT;
    (document.head || document.documentElement).appendChild(s);
    // Ad Placement API: 게임 레벨 전환용 전면/보상형 광고 호출 헬퍼
    window.adBreak = window.adConfig = function (o) { adsbygoogle.push(o); };
    window.adConfig({ preloadAdBreaks: "on", sound: "on" });   // 다음 광고 미리 로드
  }
</script>
<style>
  :root { --bg:#0b0d16; --panel:#161a2b; --ink:#e8ebf7; --muted:#8b93b5; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(1200px 800px at 50% -10%, #1a1f38, var(--bg));
         color:var(--ink); font-family:system-ui,"Segoe UI",sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:10px; padding:14px; }
  h1 { margin:2px 0 0; font-size:20px; } h1 span { color:#ff5db1; }
  #hud { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .chip { background:var(--panel); border:1px solid #232a44; border-radius:12px; padding:7px 12px;
          display:flex; flex-direction:column; gap:2px; min-width:150px; }
  .chip .meta { gap:8px; }
  .chip .top { display:flex; align-items:center; gap:7px; font-weight:600; font-size:13px; }
  .chip .dot { width:12px; height:12px; border-radius:4px; box-shadow:0 0 8px currentColor; }
  .chip .meta { font-size:11px; color:var(--muted); display:flex; justify-content:space-between; }
  .chip.dead { opacity:.4; filter:grayscale(1); }
  .chip.me { outline:2px solid #ff5db1; }
  /* 자기 칩의 질주 스태미나 바 */
  .chip .stam { height:5px; border-radius:3px; background:#1b2138; overflow:hidden; margin-top:3px; }
  .chip .stam i { display:block; height:100%; background:linear-gradient(90deg,#22d3ee,#a3e635); transition:width .12s linear; }
  .chip .stam.low i { background:linear-gradient(90deg,#fb923c,#ff5db1); }
  /* 좌측 포획 랭킹 패널 (채팅창과 대칭, 좌측 고정) */
  #rank { position:fixed; left:14px; top:70px; width:210px; max-width:22vw;
          background:rgba(22,26,43,.86); backdrop-filter:blur(6px);
          border:1px solid #232a44; border-radius:14px; overflow:hidden;
          box-shadow:0 14px 44px rgba(0,0,0,.45); z-index:30; }
  #rank.hidden { display:none; }
  #rank .rhead { padding:9px 13px; font-size:12px; font-weight:700; letter-spacing:.6px;
                 color:var(--muted); border-bottom:1px solid #232a44; }
  #rank .rlist { display:flex; flex-direction:column; }
  #rank .rrow { display:flex; align-items:center; gap:8px; padding:8px 12px; font-size:13px;
                border-bottom:1px solid rgba(35,42,68,.6); }
  #rank .rrow:last-child { border-bottom:0; }
  #rank .rrow.me { background:rgba(255,93,177,.12); }
  #rank .rrow.dead { opacity:.45; filter:grayscale(1); }
  #rank .rpos { width:18px; text-align:center; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums; }
  #rank .rrow:nth-child(1) .rpos { color:#ffd54a; }
  #rank .rdot { width:10px; height:10px; border-radius:3px; box-shadow:0 0 6px currentColor; flex:none; }
  #rank .rname { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #rank .rscore { color:#ffd54a; font-weight:700; font-variant-numeric:tabular-nums; }
  #rank .rtraps { color:var(--muted); font-size:11px; }
  @media (max-width:900px){ #rank { display:none; } }
  canvas { background:#05060c; border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.5);
           aspect-ratio:2/3; height:min(84vh, 860px); width:auto; max-width:94vw; }
  #help { color:var(--muted); font-size:12px; text-align:center; max-width:640px; line-height:1.5; }
  #status { font-size:13px; color:#ffb400; min-height:18px; }
  kbd { background:#232a44; border-radius:5px; padding:1px 6px; font-size:11px; }
  button { background:#ff5db1; color:#fff; border:0; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }

  /* ---- 초기(타이틀) 화면: "게임 시작"을 누르기 전까지 게임 뷰를 덮는다 ---- */
  #start { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center;
           background:radial-gradient(1200px 800px at 50% -10%, #1a1f38, var(--bg)); }
  #start.hidden { display:none; }
  /* 우측 상단 언어 전환 */
  #langSwitch { position:relative; z-index:20; }
  /* 메인 상단 유틸 아이콘바 */
  #start #topbar { position:absolute; top:14px; right:16px; left:16px; z-index:20;
                   display:flex; align-items:center; gap:8px; }
  #start #topbar #langSwitch { margin-right:auto; }   /* 언어는 좌측, 나머지 아이콘은 우측 */
  #start .iconbtn { background:rgba(22,26,43,.85); color:var(--ink); border:1px solid #2a3350;
                    border-radius:10px; height:38px; min-width:40px; padding:0 10px; font-size:17px;
                    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:3px; }
  #start .iconbtn:hover { border-color:#3a4570; }
  #start .iconbtn .gcount { font-size:11px; font-weight:800; color:#a3e635; }
  #langBtn { background:rgba(22,26,43,.85); color:var(--ink); border:1px solid #2a3350; border-radius:10px;
             padding:7px 11px; cursor:pointer; display:flex; align-items:center; gap:6px; font-size:13px; }
  #langBtn:hover { border-color:#3a4570; }
  #langBtn .caret { opacity:.7; font-size:11px; }
  #langMenu { position:absolute; top:calc(100% + 6px); right:0; background:#161a2b; border:1px solid #2a3350;
              border-radius:10px; padding:5px; min-width:132px; box-shadow:0 8px 24px rgba(0,0,0,.45);
              display:flex; flex-direction:column; gap:2px; }
  #langMenu.hidden { display:none; }
  #langMenu button { background:none; border:none; color:var(--ink); text-align:left; padding:8px 12px;
                     border-radius:7px; cursor:pointer; font-size:13px; }
  #langMenu button:hover { background:#222a45; }
  #langMenu button.on { background:#2b3a66; font-weight:600; }
  /* 모바일 터치 컨트롤 (플로팅 조이스틱 + 질주) */
  #touch { position:fixed; inset:0; z-index:35; pointer-events:none; }
  #touch.hidden { display:none; }
  /* 좌측 하단 감지 영역: 여기를 터치하면 그 지점에 조이스틱이 생긴다 */
  #joyZone { position:absolute; left:0; bottom:0; width:64%; height:58%; pointer-events:auto; touch-action:none; }
  #joy { position:absolute; width:124px; height:124px; margin:-62px 0 0 -62px; border-radius:50%;
         border:2px solid rgba(150,160,210,.45); background:rgba(18,24,42,.32); pointer-events:none;
         touch-action:none; }
  #joy.hidden { display:none; }
  #joyKnob { position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px;
             border-radius:50%; background:rgba(124,92,255,.72); border:2px solid #c3b6ff;
             box-shadow:0 4px 14px rgba(0,0,0,.4); }
  .tsprint { position:absolute; right:22px; bottom:calc(30px + env(safe-area-inset-bottom, 0px));
             width:88px; height:88px; border-radius:50%; border:1px solid #7c5cff; font-size:15px;
             font-weight:800; background:rgba(124,92,255,.28); color:#dcd6ff; display:flex;
             align-items:center; justify-content:center; cursor:pointer; user-select:none;
             -webkit-user-select:none; touch-action:none; -webkit-tap-highlight-color:transparent;
             pointer-events:auto; }
  .tsprint.on { background:rgba(124,92,255,.6); color:#fff; }
  body.touch #chatPanel { display:none !important; }   /* 모바일: 채팅 로그 숨김 */
  /* 인게임 상단 게임 제목 + 상태 안내문 제거 → 게임 뷰 공간 확보 (제목은 타이틀 화면 로고로 충분) */
  body > h1, #status { display:none; }
  /* 모바일: 조이스틱 조작 중 화면이 스크롤/바운스/줌 되지 않게 완전 고정 + 여백 최소화로 뷰 확대 */
  html { overscroll-behavior:none; }
  body.touch { overscroll-behavior:none; }
  body.touch.ingame { position:fixed; inset:0; overflow:hidden; touch-action:none; padding:6px; gap:6px; }
  body.touch.ingame canvas { touch-action:none; height:min(90vh,960px); max-width:calc(100vw - 12px); }
  #start .logo { margin:0; font-size:min(16vw,68px); font-weight:800; letter-spacing:3px;
                 text-shadow:0 6px 34px rgba(255,93,177,.4); }
  #start .logo span { color:#ff5db1; }
  #start .tag { color:var(--muted); font-size:13px; letter-spacing:4px; text-transform:uppercase; margin-top:-6px; }
  #start .card { background:var(--panel); border:1px solid #232a44; border-radius:16px;
                 padding:20px 22px; max-width:420px; width:100%; display:flex; flex-direction:column; gap:14px;
                 box-shadow:0 20px 60px rgba(0,0,0,.5); }
  #start .rules { color:var(--muted); font-size:13px; line-height:1.7; text-align:left; }
  #start .rules b { color:var(--ink); }
  /* (마커 스킨 선택 UI 제거 — 추후 이미지 기반으로 재작업 예정) */
  /* ---- 조작 안내: CSS 로 그린 키보드 ---- */
  #start .controls { display:flex; justify-content:center; align-items:flex-end; gap:20px; flex-wrap:wrap;
                     padding:6px 0 2px; border-top:1px solid #232a44; }
  #start .ctrl { display:flex; flex-direction:column; align-items:center; gap:8px; }
  #start .clabel { font-size:12px; color:var(--muted); letter-spacing:.5px; }
  #start .keys { display:flex; gap:4px; }
  #start .key { display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box;
                min-width:30px; height:30px; padding:0 9px; font-size:14px; font-weight:700; line-height:1;
                color:#dfe4f5; background:linear-gradient(#2b3352,#1a2038);
                border:1px solid #3a4570; border-bottom:3px solid #10152a; border-radius:7px;
                box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08); }
  #start .key.wide { min-width:auto; padding:0 12px; font-size:13px; }
  #start .arrows { display:grid; grid-template-columns:repeat(3,30px); grid-template-rows:repeat(2,30px); gap:4px; }
  #start .arrows .key:nth-child(1){ grid-area:1/2; }   /* ↑ */
  #start .arrows .key:nth-child(2){ grid-area:2/1; }   /* ← */
  #start .arrows .key:nth-child(3){ grid-area:2/2; }   /* ↓ */
  #start .arrows .key:nth-child(4){ grid-area:2/3; }   /* → */
  #start .arrows .key { animation:keypress 4s infinite; }
  #start .arrows .key:nth-child(1){ animation-delay:0s; }
  #start .arrows .key:nth-child(2){ animation-delay:1s; }
  #start .arrows .key:nth-child(3){ animation-delay:2s; }
  #start .arrows .key:nth-child(4){ animation-delay:3s; }
  @keyframes keypress {
    0%,18%,100% { transform:translateY(0); border-bottom-color:#10152a; color:#dfe4f5;
                  box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08); }
    6% { transform:translateY(2px); border-bottom-color:#ff5db1; color:#fff;
         box-shadow:0 0 12px rgba(255,93,177,.55), inset 0 1px 0 rgba(255,255,255,.1); }
  }
  @media (prefers-reduced-motion: reduce) { #start .arrows .key { animation:none; } }
  #start input { background:#0e1120; border:1px solid #2a3350; border-radius:10px; color:var(--ink);
                 padding:11px 13px; font-size:15px; outline:none; text-align:center; }
  #start input:focus { border-color:#ff5db1; }
  #start .go { font-size:17px; font-weight:700; padding:13px 16px; border-radius:12px; }
  #start .go:disabled { opacity:.6; cursor:default; }
  #start .err { color:#ff6b6b; font-size:13px; min-height:18px; }
  #start .online { color:var(--muted); font-size:13px; text-align:center; }
  #start .online b { color:#a3e635; }
  #start .go2 { background:#232a44; color:var(--ink); font-size:15px; font-weight:700;
                padding:11px 16px; border-radius:12px; }
  #start .go2:hover { background:#2d3656; }
  #start .joinrow { display:flex; gap:8px; }
  #start .joinrow input { flex:1; font-size:14px; padding:10px 12px; }
  #start .joinrow button { background:#232a44; color:var(--ink); border-radius:10px; padding:0 16px; font-size:14px; font-weight:700; }
  #start .joinrow button:hover { background:#2d3656; }
  #start .go-daily { background:linear-gradient(90deg,#f9a825,#ff7043); color:#1b1200; font-size:16px;
                     font-weight:800; padding:12px 16px; border-radius:12px; box-shadow:0 6px 20px rgba(249,168,37,.28); }
  #start .go-daily:hover { filter:brightness(1.06); }
  /* 접기 섹션(친구와 플레이 / 게임 방법) — 네이티브 <details> */
  #start .fold { border:1px solid #232a44; border-radius:12px; background:#10152a; }
  #start .fold > summary { list-style:none; cursor:pointer; padding:11px 14px; font-size:14px; font-weight:700;
                           color:#c9d0f0; display:flex; align-items:center; }
  #start .fold > summary::-webkit-details-marker { display:none; }
  #start .fold > summary::after { content:"▾"; margin-left:auto; opacity:.6; transition:transform .15s; }
  #start .fold[open] > summary::after { transform:rotate(180deg); }
  #start .fold .foldbody { padding:2px 14px 14px; display:flex; flex-direction:column; gap:12px; }
  #start .fold.howto > summary { justify-content:center; gap:7px; font-weight:600; font-size:13px; color:var(--muted); }
  #start .fold.howto > summary::after { margin-left:7px; }
  #start .fold.howto > summary .sep { opacity:.45; }
  #start .fold.howto .rules { margin-top:2px; }

  /* 대기실(로비) */
  #lobby { position:fixed; inset:0; z-index:48; display:flex; align-items:center; justify-content:center;
           padding:24px; background:radial-gradient(1200px 800px at 50% -10%, #1a1f38, var(--bg)); }
  #lobby.hidden { display:none; }
  #lobby .lcard { background:var(--panel); border:1px solid #232a44; border-radius:16px;
                  padding:24px; max-width:440px; width:100%; display:flex; flex-direction:column;
                  gap:14px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  #lobby .ltitle { font-size:22px; font-weight:800; letter-spacing:2px; }
  #lobby .lcode { font-size:15px; color:var(--muted); }
  #lobby .lcode b { color:#ffe066; font-size:19px; letter-spacing:2px; font-family:ui-monospace,Menlo,monospace; }
  #lobby .lcode button { background:#232a44; color:var(--ink); border-radius:8px; padding:5px 10px; font-size:12px; margin-left:6px; }
  #lobby .lplayers { display:flex; flex-direction:column; gap:6px; }
  #lobby .lp { display:flex; align-items:center; gap:8px; justify-content:center; font-size:15px; }
  #lobby .lp .dot { width:12px; height:12px; border-radius:4px; box-shadow:0 0 8px currentColor; }
  #lobby .lstatus { font-size:16px; font-weight:700; color:#a3e635; min-height:22px; }
  #lobby .lhint { color:var(--muted); font-size:12px; line-height:1.6; }
  /* dev 전용 스테이지 선택 (dev 서버에서만 노출) */
  #start .dev-stage { display:flex; align-items:center; justify-content:space-between; gap:12px;
                      background:#0e1120; border:1px dashed #3a4570; border-radius:10px;
                      padding:9px 13px; font-size:13px; color:var(--muted); }
  #start .dev-stage[hidden] { display:none; }
  #start .dev-stage select { background:#161a2b; border:1px solid #2a3350; border-radius:8px;
                             color:var(--ink); padding:6px 10px; font-size:14px; outline:none; }
  #start .dev-stage select:focus { border-color:#ff5db1; }

  /* ---- 우측 채팅창: 대화 로그 + 입력 ---- */
  #chatPanel { position:fixed; right:14px; top:70px; width:340px; max-width:34vw;
               max-height:min(72vh, 640px); display:flex; flex-direction:column;
               background:rgba(22,26,43,.86); backdrop-filter:blur(6px);
               border:1px solid #232a44; border-radius:14px; overflow:hidden;
               box-shadow:0 14px 44px rgba(0,0,0,.45); z-index:30; }
  #chatPanel.hidden { display:none; }
  /* 왼쪽 가장자리 드래그 핸들: 좌우로 끌어 채팅창 너비 조절 */
  #chatResize { position:absolute; left:0; top:0; bottom:0; width:8px; cursor:ew-resize; z-index:2;
                display:flex; align-items:center; justify-content:center; }
  #chatResize::before { content:""; width:3px; height:34px; border-radius:3px; background:#3a4570; opacity:.7; transition:.12s; }
  #chatResize:hover::before, #chatPanel.resizing #chatResize::before { background:#ff5db1; opacity:1; height:60px; }
  #chatPanel.chat-stacked #chatResize { display:none; }
  /* ---- 게임 오버 3D 카운트다운 오버레이 ---- */
  /* 게임 화면을 가리지 않고(투명), 그 위에 3D 숫자만 떠 있게 한다. */
  /* 반투명 베일: 숫자·원 외에는 뒤 게임 화면이 어둡게 비쳐 보인다. */
  #gameover { position:fixed; inset:0; z-index:40; pointer-events:none; background:rgba(4,6,14,.45); }
  #gameover.hidden { display:none; }
  /* 전역 canvas 규칙의 background:#05060c 를 덮어 fx3d 를 투명하게 (안 그러면 게임이 안 보임). */
  #gameover #fx3d { position:absolute; inset:0; width:100%; height:100%; background:transparent !important;
                    aspect-ratio:auto; border-radius:0; box-shadow:none; }
  #gameover .go-hint { position:absolute; left:0; right:0; bottom:5.5vh; text-align:center;
                       color:#e8ebf7; font-size:15px; text-shadow:0 2px 10px rgba(0,0,0,.85); }
  #gameover .go-hint b { color:#ffd54a; }
  #gameover .go-hint .go-big { display:inline-block; margin:7px 0; font-size:28px; font-weight:900; letter-spacing:.5px; }
  /* HUD 활성 버프 아이콘(내 배너) + 툴팁 */
  .chip .boons { display:flex; gap:5px; margin-top:5px; flex-wrap:wrap; }
  .chip .bicon { position:relative; font-size:15px; line-height:1; cursor:pointer; user-select:none;
                 -webkit-user-select:none; filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .chip .bicon .bx { font-size:10px; color:#a3e635; font-weight:800; vertical-align:top; }
  #boonTip { position:fixed; z-index:70; max-width:230px; background:rgba(10,13,24,.96); color:#e8ebf7;
             border:1px solid #3a4570; border-radius:10px; padding:8px 11px; font-size:12px; line-height:1.4;
             box-shadow:0 10px 28px rgba(0,0,0,.55); pointer-events:none; opacity:0; transition:opacity .12s; }
  #boonTip.show { opacity:1; }
  #boonTip b { color:#ffe08a; }

  if (token) opts.token = token;
  if (mode === "daily") room = await client.create("game", { ...opts, daily: true });       // 데일리 챌린지(솔로·날짜 시드)
  else if (mode === "create") room = await client.create("game", { ...opts, private: true });   // 비공개 방
  else if (mode === "join") room = await client.joinById(code, { ...opts });                 // 코드로 특정 방
  else room = await client.joinOrCreate("game", opts);                                       // 빠른 참가(순차 입장)
  statusEl.textContent = t("connected_play");
  // Keep this handler TRIVIAL: just latch the latest state. The heavy per-update work
  // (scanning the 4096-cell trail array, capturing enemy snapshots) is done once per
  // render frame instead — so a burst of queued patches can't pile up scans and stall
  // the main thread (which was making input feel ~1s late on the host).
  room.onStateChange((s) => { state = s; GW = s.gridW; GH = s.gridH; });
  room.state.listen?.("imageId", (v) => { if (v) img.src = `${HTTP_URL}/images/${v}_blur.jpg`; });
  // preload the next stage's image during the countdown → next round starts hitch-free
  room.state.listen?.("nextImageId", (v) => { if (v) preImg.src = `${HTTP_URL}/images/${v}_blur.jpg`; });
  // capture popups: server broadcasts one per trapped-monster batch
  room.onMessage("trap", (ev) => {
    flashes.push({
      x: ev.x, y: ev.y, color: playerColor(ev.owner), life: 1.2, ttl: 1.2,
      text: ev.count > 1 ? t("capture_multi", ev.count, ev.bonus) : t("capture_one", ev.count, ev.bonus),
    });
    sfxCapture(ev.count);   // 포획 효과음
    spawnJuice(ev.x + 0.5, ev.y + 0.5, playerColor(ev.owner), 10 + ev.count * 6, 1.2 + ev.count * 0.25);
    addShake(0.2 + Math.min(0.24, ev.count * 0.05));   // 포획 손맛(잡을수록 크게)
  });
  // 아이템 획득: 점유한 칸의 아이템을 먹으면 서버가 종류/위치를 알려준다 → 이름 팝업 + 효과음
  room.onMessage("item", (ev) => {
    flashes.push({
      x: ev.x, y: ev.y, color: ITEM_COLOR[ev.kind] || "#fff", life: 1.4, ttl: 1.4,
      text: `${ITEM_ICON[ev.kind] || "★"} ${I18N[LANG]["item_" + ev.kind] ? t("item_" + ev.kind) : t("item_generic")}`,
    });
    sfxItem();    // 파워업 획득음
    spawnJuice(ev.x + 0.5, ev.y + 0.5, ITEM_COLOR[ev.kind] || "#fff", 16, 1.5);
    addShake(0.18);
  });
  // 동료 부활: 되살아난 자리에 초록 파티클 + 팝업 + 효과음
  room.onMessage("revive", (ev) => {
    flashes.push({ x: ev.x, y: ev.y, color: "#a3e635", life: 1.4, ttl: 1.4, text: t("revived") });
    spawnJuice(ev.x + 0.5, ev.y + 0.5, "#a3e635", 26, 1.8);
    addShake(0.22);
    try { sfxItem(); } catch {}
  });
  // 블랙홀 예고: 그 자리에 블랙홀을 띄워 회피를 유도(예고가 끝나면 서버가 맵을 지우고 보스 등장)
  room.onMessage("warp", (ev) => {
    warps.push({ x: ev.x, y: ev.y, t0: performance.now(), burst: false });
    shakeT = 0.22;   // 예고 시작 시 약한 흔들림 (버스트 때 크게)
  });
  // chat: show a speech bubble over the sender's marker (~3s) AND log it in the side panel
  room.onMessage("chat", (ev) => {
    bubbles.set(ev.owner, { text: ev.text, until: performance.now() + 3000 });
    appendChat(ev.owner, ev.text);
  });
}

// ── 결과 공유 ───────────────────────────────────────────────────
// 클리어/게임오버 결과를 카드 이미지로 만들어 공유(Web Share)하거나, 미지원이면 저장/복사한다.
let toastTimer = 0;
function toast(msg) {
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function drawCover(g, im, dx, dy, dw, dh) {
  const s = Math.max(dw / im.naturalWidth, dh / im.naturalHeight);
  const sw = dw / s, sh = dh / s, sx = (im.naturalWidth - sw) / 2, sy = (im.naturalHeight - sh) / 2;
  g.drawImage(im, sx, sy, sw, sh, dx, dy, dw, dh);
}
function shareText(stage, score, daily) {
  return (daily ? t("share_daily") : t("share_normal")).replace("{0}", stage).replace("{1}", score);
}
function buildShareCard({ stage, score, ms, daily }) {
  const W = 560, H = 760, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#1a1f38"); bg.addColorStop(1, "#0b0d16");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // 타이틀 One More Inch
  g.font = "800 38px system-ui, sans-serif"; g.textAlign = "left";
  const t1 = "One More ", w1 = g.measureText(t1).width, w2 = g.measureText("Inch").width, sx = (W - w1 - w2) / 2;
  g.fillStyle = "#e8ebf7"; g.fillText(t1, sx, 66);
  g.fillStyle = "#ff5db1"; g.fillText("Inch", sx + w1, 66);
  g.textAlign = "center";
  // 클리어 그림(있으면)
  const iw = 300, ih = 450, ix = (W - iw) / 2, iy = 92;
  if (img && img.complete && img.naturalWidth) {
    g.save(); roundRect(g, ix, iy, iw, ih, 16); g.clip(); drawCover(g, img, ix, iy, iw, ih); g.restore();
  } else { g.fillStyle = "#141a2e"; roundRect(g, ix, iy, iw, ih, 16); g.fill(); }
  g.strokeStyle = "rgba(150,160,210,.4)"; g.lineWidth = 2; roundRect(g, ix, iy, iw, ih, 16); g.stroke();
  // 점수
  g.fillStyle = "#a3e635"; g.font = "800 58px system-ui, sans-serif"; g.fillText(String(score), W / 2, 612);
  g.fillStyle = "#8b93b5"; g.font = "600 18px system-ui, sans-serif"; g.fillText(t("sh_score"), W / 2, 638);
  // 스테이지 · 시간
  g.fillStyle = "#c9d0f0"; g.font = "700 22px system-ui, sans-serif";
  g.fillText(`${t("sh_stage")} ${stage}  ·  ⏱ ${(Math.max(0, ms) / 1000).toFixed(1)}s`, W / 2, 682);
  if (daily) { g.fillStyle = "#f9a825"; g.font = "800 18px system-ui, sans-serif"; g.fillText("🔥 " + t("daily_rank_title"), W / 2, 712); }
  g.fillStyle = "#5b6488"; g.font = "600 14px system-ui, sans-serif"; g.fillText(location.host, W / 2, 742);
  return c;
}
async function shareResult() {
  if (!state) return;
  const stage = state.level | 0, score = state.runScore | 0, ms = state.clearMs | 0, daily = state.daily ? 1 : 0;
  const card = buildShareCard({ stage, score, ms, daily });
  const name = `one-more-inch_${daily ? "daily_" : ""}${score}.png`;
  const text = shareText(stage, score, daily);
  const blob = await new Promise((res) => card.toBlob(res, "image/png"));
  try {
    if (blob && navigator.canShare) {
      const file = new File([blob], name, { type: "image/png" });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "One More Inch", text }); return; }
    }
  } catch { return; }   // 사용자가 공유 시트를 취소한 경우 — 조용히 종료
  if (blob) {   // 폴백: 이미지 저장
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast(t("share_saved")); return;
  }
  try { await navigator.clipboard.writeText(text + " " + location.origin); toast(t("share_copied")); } catch {}   // 최후: 텍스트 복사
}

// Supabase 인증 에러 메시지를 한글로 (매핑 안 된 건 원문 표시)
function krAuthError(msg) {
  const m = (msg || "").toLowerCase();
  if (m.includes("invalid login credentials")) return t("auth_invalid");
  if (m.includes("already registered") || m.includes("already been registered") || m.includes("user already")) return t("auth_registered");
  if (m.includes("email not confirmed")) return t("auth_not_confirmed");
  if (m.includes("should be at least") || (m.includes("password") && m.includes("6 char"))) return t("auth_pass_short");
  if (m.includes("unable to validate email") || m.includes("invalid email") || m.includes("invalid format")) return t("auth_email_format");
  if (m.includes("weak password")) return t("auth_weak");
  if (m.includes("rate limit") || m.includes("too many")) return t("auth_rate");
  if (m.includes("for security purposes")) return t("auth_retry");
  if (m.includes("signups not allowed") || (m.includes("signup") && m.includes("disabled"))) return t("auth_signup_disabled");
  if (m.includes("failed to fetch") || m.includes("networkerror") || m.includes("network")) return t("auth_network");
  return t("auth_error_prefix") + (msg || t("auth_unknown"));
}
async function doAuth(kind) {
  const email = document.getElementById("lgEmail").value.trim();
  const pass = document.getElementById("lgPass").value;
  const name = document.getElementById("lgName").value.trim();
  if (!email || !pass) { lgMsg.className = "lgmsg"; lgMsg.textContent = t("err_need_email_pass"); return; }
  if (kind === "up" && !name) { lgMsg.className = "lgmsg"; lgMsg.textContent = t("err_need_name"); return; }
  lgMsg.className = "lgmsg"; lgMsg.textContent = t("processing");
  const { data, error } = kind === "up" ? await signUp(email, pass, name) : await signIn(email, pass);
  if (error) { lgMsg.className = "lgmsg"; lgMsg.textContent = krAuthError(error.message); return; }
  if (kind === "up" && !(data && data.session)) {   // 이메일 확인이 켜져 있으면 세션이 바로 안 생김
    lgMsg.className = "lgmsg ok"; lgMsg.textContent = t("confirm_sent");
    return;
  }
  closeLogin();   // onAuth 가 도감 로드/병합 처리
}

// dev 서버면 시작 화면에 스테이지 선택을 노출한다. 서버 /config 로 판별하며,
// 프로덕션(dev=false)에선 선택 UI가 나타나지 않는다.
let devMode = false;
(async () => {
  try {
    const cfg = await fetch(`${HTTP_URL}/config`).then((r) => r.json());
    imageCount = cfg?.imageCount || 0; updateGalleryCount();
    if (!cfg?.dev) return;
    devMode = true;

    for (let i = 1; i <= MAX_STAGE; i++) {

let gameShown = false;   // 게임 화면(캔버스)이 이미 드러났는지
async function enterGame(mode) {

// 대기실 화면 갱신 + phase 가 playing 이 되면 게임 화면을 드러낸다. render 루프에서 매 프레임 호출.
let lastLobbyKey = "";
function updateOverlays() {

    scoreHud.classList.add("hidden"); document.body.classList.remove("result"); lastScoreKey = "";

    if (!gameShown) {
      gameShown = true;

      if (IS_TOUCH && touchEl) touchEl.classList.remove("hidden");   // 모바일 터치 컨트롤 노출

    }
    // 게임 오버: 화면 전체 3D 카운트다운(10초). 그 안에 Enter 면 이 방에서 재시작(window keydown),

        const ok = showCountdown3D();                          // three.js 시작(실패 시 false)
        gameoverEl.classList.remove("hidden");

          setTimeout(openDailyBoard, 1600);

      // 이어하기 남은 횟수 안내는 최신 state.continues 로 갱신(정확). 게임오버 화면이라 매 프레임도 무방.

        const hintEl = document.querySelector("#gameover .go-hint");

      goNumEl.textContent = remain;   // 2D 폴백 숫자 (WebGL 미지원 시)

    } else if (lostSince !== 0) {

    // 클리어: 복원한 그림을 도감에 자동 추가(다운로드는 도감에서). 사운드도 한 번 재생.
    if (state.phase === "won") {

    // 점수/최고기록 패널: 클리어·게임오버에서만 표시 (내용이 바뀔 때만 다시 그림). 로컬 최고기록도 갱신.
    if (state.phase === "won" || state.phase === "lost") {

      if (skey !== lastScoreKey) {

        const b = loadBest();

        if (state.phase === "won") {
          b.stage = Math.max(b.stage, state.level|0);
          if ((state.clearMs|0) > 0) b.timeMs = b.timeMs ? Math.min(b.timeMs, state.clearMs|0) : (state.clearMs|0);
        }
        saveBest(b);
        try { renderSkinPicker(); } catch {}   // 새로 도달한 스테이지/챌린지로 언락된 스킨을 피커에 반영
        scoreHud.innerHTML = renderScore(state, b);
        // 승리 화면: 점수 요약을 (그림을 가리는 상단 패널 대신) 캔버스 하단 배너에 그린다.
        wonStatsLine = `⏱ ${fmtSec(state.clearMs)} · +${state.stageScore} · ${t("sh_score")} ${state.runScore}`;
        wonBestLine  = `${t("sh_best")} ${b.score} · ⚡ ${b.timeMs ? fmtSec(b.timeMs) : "—"} · ${t("sh_stage")} ${b.stage || "—"}`;
      }

      // 패배: 그림 리빌이 없으므로 상단 패널을 그대로 보여준다.

      document.body.classList.add("result");
      // 로그라이트 버프 3택: 클리어 + 서버가 후보를 제시했을 때만
      if (state.phase === "won" && state.boonOffers) renderBoons(state.boonOffers, state.boons);
      else hideBoonPick();
    } else {
      scoreHud.classList.add("hidden");

    }
  }
}

      stage: +(localStorage.getItem("galsBestStage") || 0) || 0,

  } catch { return { score: 0, timeMs: 0, stage: 0 }; }
}
function saveBest(b) {

}

         + `<div class="sh-best">${best}</div>`;

       + `<div class="sh-run">${t("sh_score")} <b>${s.runScore}</b></div>`
       + `<div class="sh-best">${best}</div>`;

// dev 보스 소환: 서버에 요청 → 10초 카운트다운 후 출현 (blur 로 스페이스/엔터 재발동 방지)

// ---- input: send held direction (0..4) on change ----
const CODE_DIR = {
  ArrowUp:1, KeyW:1, ArrowDown:2, KeyS:2, ArrowLeft:3, KeyA:3, ArrowRight:4, KeyD:4,
};
const pressOrder = [];
let lastSentDir = -1, lastSentBoost = false, boostHeld = false;
function currentDir() {
  let dir = 0;
  for (const code of pressOrder) if (CODE_DIR[code] != null) dir = CODE_DIR[code];
  return dir;
}
function syncInput() {
  const d = currentDir();
  if ((d !== lastSentDir || boostHeld !== lastSentBoost) && room) {
    room.send("input", { dir: d, boost: boostHeld });
    lastSentDir = d; lastSentBoost = boostHeld;
  }
}
function typingInField() {
  const ae = document.activeElement;
  return !!(ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT" || ae.isContentEditable));
}
window.addEventListener("keydown", (e) => {
  if (typingInField()) return;   // 입력창/셀렉트에 타이핑 중이면 게임 입력으로 가로채지 않음
  if (CODE_DIR[e.code] != null || e.code === "Enter") e.preventDefault();
  if (e.repeat) return;                       // ignore OS key auto-repeat
  // 클리어 화면 버프 선택: 1/2/3 로 해당 버프, Enter 로 첫 번째 버프
  if (state && state.phase === "won" && state.boonOffers) {
    const di = { Digit1: 0, Numpad1: 0, Digit2: 1, Numpad2: 1, Digit3: 2, Numpad3: 2 }[e.code];
    if (di != null) { pickBoon(boonOfferList[di]); return; }
    if (e.code === "Enter") { pickBoon(boonOfferList[0]); return; }
  }
  if (e.code === "Enter") {
    // while playing, Enter opens the chat box; on win/loss it restarts (win → 광고 후 다음 스테이지)
    if (state && state.phase === "playing") { releaseAllKeys(); chatInput.focus(); return; }
    restartOrNextStage(); return;
  }
  if (e.code === "ShiftLeft" || e.code === "ShiftRight") { boostHeld = true; syncInput(); return; }
  if (!pressOrder.includes(e.code)) pressOrder.push(e.code);
  syncInput();
});
window.addEventListener("keyup", (e) => {
  if (typingInField()) return;
  if (e.code === "ShiftLeft" || e.code === "ShiftRight") { boostHeld = false; syncInput(); return; }
  const i = pressOrder.indexOf(e.code); if (i >= 0) pressOrder.splice(i, 1);
  syncInput();
});
// chat box: Enter sends + closes, Escape cancels (control returns to the game)
chatInput.addEventListener("keydown", (e) => {
  e.stopPropagation();
  // Ignore Enter while an IME (Korean/Japanese/etc.) is still composing — that Enter
  // only commits the composition. Sending then would grab a partial value (the
  // "only one character" bug). Send on the next, non-composing Enter.
  if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) {
    const t = chatInput.value.trim();
    if (t && room) room.send("chat", { text: t });
    chatInput.value = ""; chatInput.blur();
  } else if (e.key === "Escape") { chatInput.value = ""; chatInput.blur(); }
});
// losing focus drops all held keys and tells the server to stop, so the marker
// never keeps moving in the last direction after a missed keyup.
function releaseAllKeys(){ pressOrder.length = 0; boostHeld = false; syncInput(); }
window.addEventListener("blur", releaseAllKeys);
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAllKeys(); });
// 클리어/게임오버에서 "다음/재시작". 승리(클리어)이고 설정 스테이지 이상이면 다음 스테이지로
// 넘어가기 전에 전면광고(H5 Games Ads)를 한 번 노출한다. 광고가 없거나(퍼블리셔 ID 미설정) 스킵돼도
// adBreakDone 이 항상 호출되므로 게임은 정상적으로 다음 스테이지로 진행된다.
let adBreakInProgress = false;
// 클리어 진행(광고 게이팅 공통): 승리+설정 스테이지 이상이면 전면광고 후 sendFn 실행, 아니면 즉시.
function advanceWithAd(sendFn) {
  const wonAdvance = state && state.phase === "won" && (state.level | 0) >= (window.AD_FROM_STAGE | 0);
  if (wonAdvance && typeof window.adBreak === "function") {
    if (adBreakInProgress) return;   // 광고 표시 중 중복 트리거 방지
    adBreakInProgress = true;
    window.adBreak({
      type: "next", name: "stage-clear",
      beforeAd: () => { releaseAllKeys(); },
      adBreakDone: () => { adBreakInProgress = false; sendFn(); },

  }

}
function restartOrNextStage() {
  if (!room) return;

  advanceWithAd(() => room.send("restart"));
}

  if (dist < JOY_DEAD) { setJoyDir(null); return; }             // 데드존 안이면 정지
  const code = Math.abs(dx) > Math.abs(dy)                       // 우세한 축으로 4방향 스냅
