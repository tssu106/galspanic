name: Deploy to laptop server

# 이 노트북(self-hosted 러너)에서 직접 pull -> build -> 서버 재시작.
# main 에 push 될 때만 실행(포크 PR 은 실행 안 됨 = self-hosted 러너 안전).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    steps:
      - name: Pull, build, restart on this laptop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = [Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [Environment]::GetEnvironmentVariable("Path","User")
          git config --global --add safe.directory C:/workspace/galspanic

          Set-Location C:\workspace\galspanic
          git fetch origin main
          git reset --hard origin/main

          Set-Location C:\workspace\galspanic\server
          npm ci
          npm run build

          # 서버(예약작업) 재시작
          schtasks /end /tn GalspanicServer 2>$null
          Start-Sleep 1
          Get-NetTCPConnection -LocalPort 2567 -State Listen -ErrorAction SilentlyContinue |
            ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }
          Start-Sleep 1
          schtasks /run /tn GalspanicServer

          # 헬스체크
          Start-Sleep 6
          $h = Invoke-RestMethod http://localhost:2567/health -TimeoutSec 5
          Write-Host "deployed OK, health: $($h | ConvertTo-Json -Compress)"
