name: Deploy to laptop server

# 이 노트북(self-hosted 러너)에서 배포. 러너는 SYSTEM 예약작업 GalspanicDeploy 를
# 트리거만 하고, 실제 pull/build/restart 는 그 작업이 깨끗한 SYSTEM 컨텍스트에서 수행한다
# (러너 중첩 powershell 환경 quirk 우회). 전 과정은 C:\workspace\ci-deploy.log 에 기록된다.
# main push 에서만 실행(포크 PR 실행 안 됨 = self-hosted 러너 안전).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    steps:
      - name: Trigger SYSTEM deploy task and wait
        # 러너 기본 shell 은 ExecutionPolicy 지정 없이 dot-source 하는데, 이 머신은 정책이
        # Restricted 라 step 스크립트가 실행조차 안 된다(즉시 exit 1). Bypass 로 실행한다.
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item C:\workspace\ci-deploy.log -Force -ErrorAction SilentlyContinue
          schtasks /run /tn GalspanicDeploy
          $deadline = (Get-Date).AddSeconds(180)
          $res = $null
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            $c = Get-Content C:\workspace\ci-deploy.log -Raw -ErrorAction SilentlyContinue
            if ($c -and $c -match "DEPLOY RESULT: (OK|FAIL[^=]*)") { $res = $Matches[1].Trim(); break }
          }
          Write-Host "==================== ci-deploy.log ===================="
          if (Test-Path C:\workspace\ci-deploy.log) { Get-Content C:\workspace\ci-deploy.log | Write-Host }
          Write-Host "==================== RESULT: $res ===================="
          if ($res -ne "OK") { exit 1 }
